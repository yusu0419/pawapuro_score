<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>パワスタ — 左座・長谷川・正覚 成績帳</title>
<style>
  html, body { margin: 0; padding: 0; background: #142c22; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<!-- ====================================================================
  設定手順（デプロイする人が最初に一度だけやること）

  1. https://console.firebase.google.com にアクセスし、無料でプロジェクトを作成する
  2. プロジェクト設定 → 「アプリを追加」→ ウェブアプリ(</>) を選び、
     表示された firebaseConfig の中身を、下の FIREBASE_CONFIG にそのまま貼り付ける
  3. 左メニューの「Firestore Database」を開き、データベースを作成する
     （リージョンは asia-northeast1 = 東京 がおすすめ）
  4. Firestore の「ルール」タブを開き、下記のように書き換えて公開する
     （3人だけで使う前提のシンプルな設定。URLを他人に教えなければ実用上問題ありません）

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /pawapuro/{doc} {
             allow read, write: if true;
           }
         }
       }

  5. このファイル（index.html）を GitHub Pages や Netlify など好きな静的ホスティングに
     アップロードすれば、発行されたURLに誰でも（Claudeアカウント不要で）アクセスできます
==================================================================== -->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ▼▼▼ ここを自分の Firebase プロジェクトの設定値に置き換えてください ▼▼▼
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC2KElzSwPTBY3JSZmmqzN3m4vFuqa-c3c",
    authDomain: "pawapuro-d55d2.firebaseapp.com",
    projectId: "pawapuro-d55d2",
    storageBucket: "pawapuro-d55d2.firebasestorage.app",
    messagingSenderId: "706885402159",
    appId: "1:706885402159:web:60c066574bc981183b90da",
  };
  // ▲▲▲ ここまで ▲▲▲

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  const gamesRef = doc(db, "pawapuro", "games");

  window.fb = {
    async load() {
      const snap = await getDoc(gamesRef);
      return snap.exists() ? (snap.data().list || []) : [];
    },
    async save(list) {
      await setDoc(gamesRef, { list });
    },
    subscribe(callback) {
      return onSnapshot(gamesRef, (snap) => {
        callback(snap.exists() ? (snap.data().list || []) : []);
      });
    },
  };
  window.dispatchEvent(new Event("fb-ready"));
</script>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-type="module">
const { useState, useEffect, useMemo } = React;

const PLAYERS = ["左座", "長谷川", "正覚"];

const PITCHERS = {
  左座: ["モイネロ", "大野雄大", "山野", "前田健太", "メヒア", "中村優"],
  長谷川: ["伊藤大海", "種市", "ウィットリー", "九里", "孫", "富田"],
  正覚: ["東", "宮城", "髙橋", "篠原", "廣池", "横川"],
};

const todayStr = () => new Date().toISOString().slice(0, 10);

function emptyForm() {
  return {
    date: todayStr(),
    playerA: PLAYERS[0],
    playerB: PLAYERS[1],
    scoreA: "",
    scoreB: "",
    starterA: "",
    starterB: "",
    cold: false,
  };
}

function PawapuroScorebook() {
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyForm());
  const [error, setError] = useState("");
  const [saveError, setSaveError] = useState("");
  const [ready, setReady] = useState(!!window.fb);

  useEffect(() => {
    if (window.fb) { setReady(true); return; }
    const onReady = () => setReady(true);
    window.addEventListener("fb-ready", onReady);
    return () => window.removeEventListener("fb-ready", onReady);
  }, []);

  useEffect(() => {
    if (!ready) return;
    let unsub;
    (async () => {
      try {
        const initial = await window.fb.load();
        setGames(initial);
      } catch {
        setSaveError("データの読み込みに失敗しました。設定（firebaseConfig）を確認してください。");
      } finally {
        setLoading(false);
      }
      unsub = window.fb.subscribe((list) => setGames(list));
    })();
    return () => unsub && unsub();
  }, [ready]);

  function resultOf(g) {
    const a = Number(g.scoreA);
    const b = Number(g.scoreB);
    if (a === b) return "draw";
    return a > b ? "A" : "B";
  }

  const standings = useMemo(() => {
    const tally = Object.fromEntries(PLAYERS.map((p) => [p, { win: 0, lose: 0, draw: 0 }]));
    games.forEach((g) => {
      const r = resultOf(g);
      const weight = g.cold ? 2 : 1;
      if (r === "draw") {
        tally[g.playerA].draw += 1;
        tally[g.playerB].draw += 1;
      } else if (r === "A") {
        tally[g.playerA].win += weight;
        tally[g.playerB].lose += weight;
      } else {
        tally[g.playerB].win += weight;
        tally[g.playerA].lose += weight;
      }
    });
    return tally;
  }, [games]);

  const sortedGames = useMemo(
    () => [...games].sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : (y.id || 0) - (x.id || 0))),
    [games]
  );

  function updateForm(key, val) {
    setForm((f) => ({ ...f, [key]: val }));
  }
  function changePlayerA(val) { setForm((f) => ({ ...f, playerA: val, starterA: "" })); }
  function changePlayerB(val) { setForm((f) => ({ ...f, playerB: val, starterB: "" })); }

  async function persist(mutate) {
    try {
      const latest = await window.fb.load();
      const next = mutate(latest);
      await window.fb.save(next);
      setGames(next);
      setSaveError("");
    } catch {
      setSaveError("保存に失敗しました。通信環境を確認してもう一度お試しください。");
    }
  }

  async function submitForm(e) {
    e.preventDefault();
    if (form.playerA === form.playerB) { setError("対戦相手が同じ人になっています。"); return; }
    if (form.scoreA === "" || form.scoreB === "") { setError("点数を入力してください。"); return; }
    setError("");
    const newGame = {
      id: Date.now(),
      date: form.date,
      playerA: form.playerA,
      playerB: form.playerB,
      scoreA: Number(form.scoreA),
      scoreB: Number(form.scoreB),
      starterA: form.starterA,
      starterB: form.starterB,
      cold: form.cold,
    };
    await persist((latest) => [...latest, newGame]);
    setForm(emptyForm());
    setShowForm(false);
  }

  async function deleteGame(id) {
    await persist((latest) => latest.filter((g) => g.id !== id));
  }

  return (
    <div className="pw-root">
      <div className="pw-header">
        <div className="pw-title">
          パワスタ
          <small>左座 / 長谷川 / 正覚 — 成績帳</small>
        </div>
      </div>

      {saveError && <div className="pw-savewarn">{saveError}</div>}

      <div className="pw-board">
        {PLAYERS.map((p) => {
          const s = standings[p];
          const total = s.win + s.lose;
          const rate = total ? Math.round((s.win / total) * 100) : 0;
          return (
            <div className="pw-cell" key={p}>
              <div className="name">{p}</div>
              <div className="record">{s.win}<span className="sep">-</span>{s.lose}</div>
              <div className="rate">勝率 {rate}%{s.draw ? ` / 分${s.draw}` : ""}</div>
            </div>
          );
        })}
      </div>

      {!showForm && (
        <button className="pw-addbtn" onClick={() => setShowForm(true)}>＋ 試合を記録する</button>
      )}

      {showForm && (
        <form className="pw-form" onSubmit={submitForm}>
          <div className="pw-form-head">
            <span>試合を記録</span>
            <button type="button" onClick={() => { setShowForm(false); setError(""); }}>✕</button>
          </div>

          <div className="pw-row">
            <div>
              <label className="pw-label">日付</label>
              <input className="pw-input" type="date" value={form.date} onChange={(e) => updateForm("date", e.target.value)} />
            </div>
          </div>

          <div className="pw-row">
            <div>
              <label className="pw-label">プレイヤーA</label>
              <select className="pw-select" value={form.playerA} onChange={(e) => changePlayerA(e.target.value)}>
                {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
            <div className="pw-vs">vs</div>
            <div>
              <label className="pw-label">プレイヤーB</label>
              <select className="pw-select" value={form.playerB} onChange={(e) => changePlayerB(e.target.value)}>
                {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
              </select>
            </div>
          </div>

          <div className="pw-row">
            <div>
              <label className="pw-label">{form.playerA} 得点</label>
              <input className="pw-input" type="number" inputMode="numeric" value={form.scoreA} onChange={(e) => updateForm("scoreA", e.target.value)} />
            </div>
            <div>
              <label className="pw-label">{form.playerB} 得点</label>
              <input className="pw-input" type="number" inputMode="numeric" value={form.scoreB} onChange={(e) => updateForm("scoreB", e.target.value)} />
            </div>
          </div>

          <div className="pw-row">
            <div>
              <label className="pw-label">{form.playerA} 先発</label>
              <select className="pw-select" value={form.starterA} onChange={(e) => updateForm("starterA", e.target.value)}>
                <option value="">選択してください</option>
                {PITCHERS[form.playerA].map((name, i) => <option key={name} value={name}>{`${i + 1}. ${name}`}</option>)}
              </select>
            </div>
            <div>
              <label className="pw-label">{form.playerB} 先発</label>
              <select className="pw-select" value={form.starterB} onChange={(e) => updateForm("starterB", e.target.value)}>
                <option value="">選択してください</option>
                {PITCHERS[form.playerB].map((name, i) => <option key={name} value={name}>{`${i + 1}. ${name}`}</option>)}
              </select>
            </div>
          </div>

          <label className="pw-cold-row">
            <input type="checkbox" checked={form.cold} onChange={(e) => updateForm("cold", e.target.checked)} />
            コールド勝ち（勝敗を2としてカウント）
          </label>

          {error && <div className="pw-error">{error}</div>}

          <button className="pw-submit" type="submit">この試合を保存</button>
        </form>
      )}

      <div className="pw-loglabel">試合ログ</div>

      {loading ? (
        <div className="pw-empty">読み込み中…</div>
      ) : sortedGames.length === 0 ? (
        <div className="pw-empty">まだ記録がありません。<br />上のボタンから最初の試合を記録しましょう。</div>
      ) : (
        sortedGames.map((g) => {
          const r = resultOf(g);
          return (
            <div className={`pw-card${g.cold ? " cold" : ""}`} key={g.id}>
              <div className="pw-card-top">
                <span className="pw-date">{g.date}</span>
                <div className="pw-badges">
                  {g.cold && <span className="pw-badge">🔥 コールド</span>}
                  <button className="pw-del" onClick={() => deleteGame(g.id)}>🗑</button>
                </div>
              </div>
              <div className="pw-matchup">
                <div className={`pw-side ${r === "A" ? "win" : r === "B" ? "lose" : ""}`}>
                  <div className="pname">{g.playerA}</div>
                  <div className="pscore">{g.scoreA}</div>
                  <div className="starter">{g.starterA}</div>
                </div>
                <div className="pw-dash">–</div>
                <div className={`pw-side ${r === "B" ? "win" : r === "A" ? "lose" : ""}`}>
                  <div className="pname">{g.playerB}</div>
                  <div className="pscore">{g.scoreB}</div>
                  <div className="starter">{g.starterB}</div>
                </div>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PawapuroScorebook />);
</script>

<style>
  .pw-root {
    --field: #142c22; --field-deep: #0d1d16; --chalk: #f3efe1; --chalk-dim: #b9c4b8;
    --amber: #f0a83b; --amber-dim: #a97b32; --foul: #d1544a; --panel: #0f1b16; --line: rgba(243,239,225,0.14);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    background: var(--field);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 46px);
    color: var(--chalk); min-height: 100vh; padding: 18px 14px 40px; box-sizing: border-box;
  }
  .pw-root * { box-sizing: border-box; }
  .pw-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
  .pw-title { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; color: var(--chalk); line-height: 1; }
  .pw-title small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--chalk-dim); margin-top: 4px; }
  .pw-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
  .pw-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 6px 8px; text-align: center; }
  .pw-cell .name { font-size: 12px; font-weight: 700; color: var(--chalk-dim); letter-spacing: 0.05em; margin-bottom: 6px; }
  .pw-cell .record { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; color: var(--amber); text-shadow: 0 0 10px rgba(240,168,59,0.35); line-height: 1; }
  .pw-cell .record .sep { color: var(--chalk-dim); font-size: 20px; margin: 0 2px; }
  .pw-cell .rate { margin-top: 4px; font-size: 10px; color: var(--chalk-dim); letter-spacing: 0.05em; }
  .pw-addbtn { width: 100%; background: var(--amber); color: #1a1206; border: none; border-radius: 4px; padding: 11px; font-size: 14px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 16px; cursor: pointer; }
  .pw-form { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; margin-bottom: 18px; }
  .pw-form-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .pw-form-head span { font-size: 16px; letter-spacing: 0.05em; font-weight: 700; }
  .pw-form-head button { background: none; border: none; color: var(--chalk-dim); cursor: pointer; font-size: 16px; }
  .pw-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .pw-row > div { flex: 1; }
  .pw-label { display: block; font-size: 10px; color: var(--chalk-dim); letter-spacing: 0.06em; margin-bottom: 4px; }
  .pw-input, .pw-select { width: 100%; background: var(--field-deep); border: 1px solid var(--line); border-radius: 4px; color: var(--chalk); padding: 8px; font-size: 14px; font-family: inherit; }
  .pw-vs { text-align: center; font-size: 14px; color: var(--chalk-dim); padding-top: 18px; }
  .pw-cold-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 14px; font-size: 13px; color: var(--chalk); }
  .pw-cold-row input { width: 16px; height: 16px; accent-color: var(--amber); }
  .pw-submit { width: 100%; background: var(--amber); color: #1a1206; border: none; border-radius: 4px; padding: 10px; font-weight: 700; font-size: 14px; cursor: pointer; }
  .pw-error { color: var(--foul); font-size: 12px; margin-bottom: 8px; }
  .pw-loglabel { font-size: 16px; letter-spacing: 0.08em; color: var(--chalk-dim); margin: 4px 0 8px; font-weight: 700; }
  .pw-empty { text-align: center; color: var(--chalk-dim); font-size: 13px; padding: 30px 10px; border: 1px dashed var(--line); border-radius: 6px; }
  .pw-card { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--amber-dim); border-radius: 4px; padding: 10px 12px; margin-bottom: 8px; }
  .pw-card.cold { border-left-color: var(--foul); }
  .pw-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .pw-date { font-size: 11px; color: var(--chalk-dim); letter-spacing: 0.04em; }
  .pw-badges { display: flex; gap: 6px; align-items: center; }
  .pw-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; padding: 2px 6px; border-radius: 3px; background: rgba(209,84,74,0.18); color: var(--foul); }
  .pw-del { background: none; border: none; color: var(--chalk-dim); cursor: pointer; font-size: 13px; }
  .pw-matchup { display: flex; align-items: center; justify-content: space-between; }
  .pw-side { flex: 1; text-align: center; }
  .pw-side .pname { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .pw-side.win .pname { color: var(--amber); }
  .pw-side.lose .pname { color: var(--chalk-dim); }
  .pw-side .pscore { font-size: 24px; font-weight: 700; line-height: 1; }
  .pw-side.win .pscore { color: var(--amber); }
  .pw-side.lose .pscore { color: var(--chalk-dim); }
  .pw-side .starter { font-size: 10px; color: var(--chalk-dim); margin-top: 2px; min-height: 12px; }
  .pw-dash { font-size: 16px; color: var(--chalk-dim); padding: 0 8px; }
  .pw-savewarn { font-size: 11px; color: var(--foul); text-align: center; margin-bottom: 10px; }
</style>

</body>
</html>
