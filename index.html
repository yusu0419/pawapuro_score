<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction, deleteDoc
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyC2KElzSwPTBY3JSZmmqzN3m4vFuqa-c3c",
    authDomain: "pawapuro-d55d2.firebaseapp.com",
    projectId: "pawapuro-d55d2",
    storageBucket: "pawapuro-d55d2.firebasestorage.app",
    messagingSenderId: "706885402159",
    appId: "1:706885402159:web:60c066574bc981183b90da",
  };

  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  const gamesRef = doc(db, "pawapuro", "games");
  const draftRef = doc(db, "pawapuro", "draft");
  const claimsRef = doc(db, "pawapuro", "draft_claims"); // 「どの端末がどの名前を使っているか」

  // 既存データ（league / rosters が無い古い形式）も壊さずに読み込む
  function normalize(data) {
    const games = ((data && data.list) || []).map((g) => ({ league: 1, ...g }));
    const currentLeague = (data && data.currentLeague) || 1;
    const rosters = (data && data.rosters) || {};
    const importedPast = !!(data && data.importedPast);
    return { games, currentLeague, rosters, importedPast };
  }

  const EMPTY = { games: [], currentLeague: 1, rosters: {}, importedPast: false };

  window.fb = {
    async load() {
      const snap = await getDoc(gamesRef);
      return snap.exists() ? normalize(snap.data()) : EMPTY;
    },
    async save({ games, currentLeague, rosters, importedPast }) {
      await setDoc(gamesRef, { list: games, currentLeague, rosters, importedPast: !!importedPast });
    },
    // 取り込み前の状態を別ドキュメントに控えておく（万一のとき元に戻せる）
    async saveBackup({ games, currentLeague, rosters }) {
      await setDoc(doc(db, "pawapuro", "backup_before_import"), {
        list: games, currentLeague, rosters, savedAt: new Date().toISOString(),
      });
    },
    subscribe(callback) {
      return onSnapshot(gamesRef, (snap) => {
        callback(snap.exists() ? normalize(snap.data()) : EMPTY);
      });
    },

    // ---- ドラフト（3人の指名を同時公開する） ----
    draftSubscribe(callback, onError) {
      return onSnapshot(
        draftRef,
        (snap) => callback(snap.exists() ? snap.data() : null),
        (e) => { if (onError) onError(e); }
      );
    },
    // mutator(現在の状態) → { next } か { error }。同時に書き込んでも壊れないよう、トランザクションで実行する
    async draftTx(mutator) {
      return runTransaction(db, async (tx) => {
        const snap = await tx.get(draftRef);
        const r = mutator(snap.exists() ? snap.data() : null) || {};
        if (r.next) tx.set(draftRef, r.next);
        return r.error ? { error: r.error } : { ok: true };
      });
    },
    claimsSubscribe(callback, onError) {
      return onSnapshot(
        claimsRef,
        (snap) => callback(snap.exists() ? snap.data() : {}),
        (e) => { if (onError) onError(e); }
      );
    },
    async claimsTx(mutator) {
      return runTransaction(db, async (tx) => {
        const snap = await tx.get(claimsRef);
        const r = mutator(snap.exists() ? snap.data() : {}) || {};
        if (r.next) tx.set(claimsRef, r.next);
        return r.error ? { error: r.error } : { ok: true };
      });
    },
    // やり直すときは、名前の使用状況も消す（スマホを替えた・データを消したときの復旧にもなる）
    async draftReset() {
      await deleteDoc(draftRef);
      await deleteDoc(claimsRef);
    },
  };
  window.dispatchEvent(new Event("fb-ready"));
</script>

:false},{"id":103010,"date":"","no":10,"league":3,"playerA":"長谷川","playerB":"左座","scoreA":3,"scoreB":2,"starterA":"岩崎","starterB":"藤井","cold":false}];
const PAST_LEAGUE_COUNT = 3;

// ---- 過去大会（第1〜3期）の取り込み -----------------------------------
// 既存のデータ（いま入っている第4期など）の回数を PAST_LEAGUE_COUNT だけ後ろへずらし、
// 空いた第1〜3期に過去の試合を入れる。何度押しても二重登録されないようにしてある。
function buildImport(latest) {
  const off = PAST_LEAGUE_COUNT;
  const games = latest.games.map((g) => ({ ...g, league: (g.league || 1) + off }));
  const rosters = {};
  Object.entries(latest.rosters || {}).forEach(([k, v]) => { rosters[Number(k) + off] = v; });
  return {
    games: [...PAST_GAMES, ...games],
    currentLeague: latest.currentLeague + off,
    rosters,
    importedPast: true,
  };
}

function getRosterFor(rosters, league) {
  for (let l = league; l >= 1; l--) {
    if (rosters[l]) return rosters[l];
  }
  return DEFAULT_ROSTER;
}

const todayStr = () => new Date().toISOString().slice(0, 10);

function emptyForm() {
  return {

    playerB: PLAYERS[1],

  };

function resultOf(g) {
  const a = Number(g.scoreA);
  const b = Number(g.scoreB);
  if (a === b) return "draw";
  return a > b ? "A" : "B";
}

// ---- 集計 -------------------------------------------------------------
// 勝敗はコールドを2勝(2敗)として数える（リーグ戦の規則と同じ）

function computeTally(list) {
  const t = Object.fromEntries(
    PLAYERS.map((p) => [p, { win: 0, lose: 0, draw: 0, pf: 0, pa: 0, games: 0 }])
  );
  list.forEach((g) => {
    const a = t[g.playerA];
    const b = t[g.playerB];
    if (!a || !b) return;
    const w = g.cold ? 2 : 1;
    const r = resultOf(g);
    a.pf += Number(g.scoreA); a.pa += Number(g.scoreB);
    b.pf += Number(g.scoreB); b.pa += Number(g.scoreA);
    a.games += 1; b.games += 1;
    if (r === "draw") { a.draw += 1; b.draw += 1; }
    else if (r === "A") { a.win += w; b.lose += w; }
    else { b.win += w; a.lose += w; }
  });
  return t;
}

// 対戦表: h[自分][相手] = その相手との成績
function computeH2H(list) {
  const h = {};
  PLAYERS.forEach((p) => {
    h[p] = {};
    PLAYERS.forEach((q) => { h[p][q] = { win: 0, lose: 0, draw: 0, pf: 0, pa: 0 }; });
  });
  list.forEach((g) => {
    const A = g.playerA, B = g.playerB;
    if (!h[A] || !h[B]) return;
    const w = g.cold ? 2 : 1;
    const r = resultOf(g);
    h[A][B].pf += Number(g.scoreA); h[A][B].pa += Number(g.scoreB);
    h[B][A].pf += Number(g.scoreB); h[B][A].pa += Number(g.scoreA);
    if (r === "draw") { h[A][B].draw += 1; h[B][A].draw += 1; }
    else if (r === "A") { h[A][B].win += w; h[B][A].lose += w; }
    else { h[B][A].win += w; h[A][B].lose += w; }
  });
  return h;
}

// 先発投手ごとの成績（勝ち負けは1試合につき1。コールドでも1として数える）
function computePitchers(list) {
  const map = {};
  function add(owner, name, won, lost) {
    if (!name) return;
    const key = owner + "|" + name;
    if (!map[key]) map[key] = { owner, name, starts: 0, win: 0, lose: 0 };
    map[key].starts += 1;
    if (won) map[key].win += 1;
    if (lost) map[key].lose += 1;
  }
  list.forEach((g) => {
    const r = resultOf(g);
    add(g.playerA, g.starterA, r === "A", r === "B");
    add(g.playerB, g.starterB, r === "B", r === "A");
  });
  return Object.values(map).sort(
    (x, y) => y.win - x.win || x.lose - y.lose || y.starts - x.starts
  );
}

// 優勝の定義: 首位の勝ち数が最下位の勝ち数より5以上多くなったら、首位（勝ち数が最多）の人が優勝。
// 順位は勝ち数で決まる。5勝差に届かないままリーグを終了した場合は「優勝なし」（空配列）。
// 進行中のリーグは、5勝差に達した時点で優勝が決まる。
const TITLE_GAP = 5;
function computeChampions(games, currentLeague) {
  const result = {};
  for (let l = 1; l <= currentLeague; l++) {
    const lg = games.filter((g) => (g.league || 1) === l);
    if (lg.length === 0) continue;
    const t = computeTally(lg);
    const wins = PLAYERS.map((p) => t[p].win);
    const top = Math.max(...wins);
    const bottom = Math.min(...wins);
    if (top - bottom >= TITLE_GAP) {
      result[l] = PLAYERS.filter((p) => t[p].win === top);
    } else if (l < currentLeague) {
      result[l] = [];
    }
  }
  return result;
}

// 勝率は野球式（.590 / 1.000）。試合が無いときは .000
const pct = (w, l) => {
  if (w + l === 0) return ".000";
  const r = (w / (w + l)).toFixed(3);
  return r.startsWith("0") ? r.slice(1) : r;
};
const signed = (n) => (n > 0 ? `+${n}` : `${n}`);


// ---- 試合抽選（スロット風・1試合ずつ） ----------------------------------
// 3試合1セットで、全員がちょうど2試合ずつ（左座-長谷川、左座-正覚、長谷川-正覚が1回ずつ）。
// 先攻・後攻は毎試合まったくのランダム（偏ってもよい）。
// 先発もロースター6人から毎回まったくのランダム（同じ人が続けて投げてもよい）。
const REEL_H = 44;
const REEL_BASE = 1.3;   // 最初のリールが止まるまでの秒数
const REEL_STEP = 0.6;   // 次のリールが止まるまでの間隔
const REEL_COUNT = 4;    // 先攻・後攻・先発×2
const prefersReducedMotion = () =>
  !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

// 組み合わせのキー: 0=左座 1=長谷川 2=正覚 の番号で "0-1" / "0-2" / "1-2"
const PAIR_KEYS = ["0-1", "0-2", "1-2"];
const pairLabel = (k) => k.split("-").map((i) => PLAYERS[Number(i)]).join(" vs ");
const pairKeyOf = (g) => [PLAYERS.indexOf(g.first), PLAYERS.indexOf(g.second)].sort((x, y) => x - y).join("-");

// これまでに決まった試合(games)と、手動で「消化済み」にした組み合わせ(skipped)を除いて、次の1試合を決める
function drawNext(games, roster, skipped) {
  const used = new Set([...games.map(pairKeyOf), ...skipped]);
  const remaining = PAIR_KEYS.filter((k) => !used.has(k));
  if (remaining.length === 0) return null;
  const [i, j] = remaining[Math.floor(Math.random() * remaining.length)].split("-").map(Number);
  const iFirst = Math.random() < 0.5; // 先攻・後攻は毎回コイントス
  const first = PLAYERS[iFirst ? i : j];
  const second = PLAYERS[iFirst ? j : i];
  const pickStarter = (p) => {
    const list = roster[p] || [];
    return list.length ? list[Math.floor(Math.random() * list.length)] : "—";
  };
  return { first, second, firstStarter: pickStarter(first), secondStarter: pickStarter(second) };
}

// 縦に回転して止まるリール。runId が変わるたびに回り直す。instant が true になると即座に止まる。
function Reel({ items, finalValue, runId, duration, instant, small }) {
  const [strip, setStrip] = useState([finalValue || "?"]);
  const [y, setY] = useState(0);
  const [anim, setAnim] = useState(false);

  useEffect(() => {
    if (!runId) { setStrip([finalValue || "?"]); setY(0); setAnim(false); return; }
    if (prefersReducedMotion()) { setStrip([finalValue || "—"]); setY(0); setAnim(false); return; }
    const pool = items && items.length ? items : ["—"];
    const n = Math.round(duration * 9) + 6;
    const arr = [];
    let prev = null;
    for (let i = 0; i < n - 1; i++) {
      let pick = pool[Math.floor(Math.random() * pool.length)];
      if (pool.length > 1) { let guard = 0; while (pick === prev && guard++ < 8) pick = pool[Math.floor(Math.random() * pool.length)]; }
      arr.push(pick); prev = pick;
    }
    arr.push(finalValue || "—");
    setStrip(arr); setAnim(false); setY(0);
    let raf2;
    const raf1 = requestAnimationFrame(() => {
      raf2 = requestAnimationFrame(() => { setAnim(true); setY(-(arr.length - 1) * REEL_H); });
    });
    return () => { cancelAnimationFrame(raf1); if (raf2) cancelAnimationFrame(raf2); };
  }, [runId]);

  useEffect(() => {
    if (!instant) return;
    setAnim(false);
    setY(-(strip.length - 1) * REEL_H);
  }, [instant]);

  return (
    <div className={`pw-reel${small ? " small" : ""}`}>
      <div
        className="pw-reel-strip"
        style={{
          transform: `translateY(${y}px)`,
          transition: anim ? `transform ${duration}s cubic-bezier(0.15, 0.7, 0.1, 1)` : "none",
        }}
      >
        {strip.map((t, i) => <div className="pw-reel-item" key={i}>{t}</div>)}
      </div>
    </div>
  );
}

// 抽選結果は、リセットを押すまで残す（画面を切り替えても、ページを開き直しても）。この端末に保存。
// 「消化済みの試合」は、今のリーグの記録から自動で読み取る。
// 3試合で1セット（全組み合わせが1回ずつ）なので、今のリーグの試合数を3で割った余りの分が、今のセットの消化済み。
const DRAW_STORE_KEY = "pawapuro_draw_v2";
function loadDraw(roundStart) {
  try {
    const d = JSON.parse(window.localStorage.getItem(DRAW_STORE_KEY) || "null");
    // 別のセット（記録が3試合進んだ後）の結果は引き継がない
    if (!d || d.roundStart !== roundStart || !Array.isArray(d.games)) return [];
    return d.games
      .filter((g) => g && PLAYERS.includes(g.first) && PLAYERS.includes(g.second) && typeof g.run === "number")
      .slice(0, 3)
      .map((g) => ({ ...g, animate: false })); // 復元した結果は回さず、そのまま表示
  } catch {
    return [];
  }
}
function saveDraw(roundStart, games) {
  try {
    window.localStorage.setItem(DRAW_STORE_KEY, JSON.stringify({ roundStart, games: games.map(({ animate, ...g }) => g) }));
  } catch {}
}

function DrawTab({ roster, league, leagueGames }) {
  // 今のリーグの記録（古い順）から、今のセットの消化済みの組み合わせを求める
  const ordered = [...leagueGames].sort((x, y) => (x.no || 0) - (y.no || 0) || (x.id || 0) - (y.id || 0));
  const inRound = ordered.length % 3;
  const roundStart = ordered.length - inRound;
  const played = ordered.slice(roundStart).map((g) =>
    [PLAYERS.indexOf(g.playerA), PLAYERS.indexOf(g.playerB)].sort((x, y) => x - y).join("-")
  );

  const [all, setAll] = useState(() => loadDraw(roundStart)); // 抽選して決まった試合
  const [spinning, setSpinning] = useState(false);
  const [instant, setInstant] = useState(false);
  const runCounter = useRef(0);
  const timer = useRef(null);
  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => { saveDraw(roundStart, all); }, [all, roundStart]);
  // 記録が3試合進んでセットが変わったら、前のセットの抽選結果は捨てる
  useEffect(() => { setAll((cur) => (cur.length ? [] : cur)); }, [roundStart]);

  // 記録済みになった抽選結果は「消化済み」として表示するので、抽選中の一覧からは外す
  const games = all.filter((g) => !played.includes(pairKeyOf(g)));
  const total = played.length + games.length;
  const done = total >= 3;

  function drawOne() {
    if (spinning || done) return;
    const next = drawNext(games, roster, played);
    if (!next) return;
    clearTimeout(timer.current);
    runCounter.current += 1;
    const run = Date.now() * 10 + (runCounter.current % 10);
    setAll([...games, { ...next, run, animate: true }]);
    setInstant(false);
    setSpinning(true);
    const ms = prefersReducedMotion() ? 0 : (REEL_BASE + REEL_STEP * (REEL_COUNT - 1)) * 1000 + 300;
    timer.current = setTimeout(() => setSpinning(false), ms);
  }
  function skip() {
    clearTimeout(timer.current);
    setInstant(true);
    setSpinning(false);
  }
  function reset() {
    if (!window.confirm("抽選結果を消して、最初からやり直しますか？")) return;
    clearTimeout(timer.current);
    setAll([]);
    setSpinning(false);
    setInstant(false);
  }

  const dur = (k) => REEL_BASE + REEL_STEP * k;
  const last = games[games.length - 1];
  const slots = [
    ...played.map((k) => ({ kind: "skipped", k })),
    ...games.map((g) => ({ kind: "drawn", g })),
  ];
  while (slots.length < 3) slots.push({ kind: "pending" });
  const blank = { first: "?", second: "?", firstStarter: "?", secondStarter: "?" };

  return (
    <>
      <div className="pw-drawintro">
        1試合ずつ決めます。3試合で全員がちょうど2試合ずつ戦います。先攻・後攻と先発（第{league}期のメンバー6人）は、毎回まったくのランダムです。今のリーグの記録から消化済みの試合を読み取って、残りの試合だけを抽選します。結果は、リセットを押すまで残ります。
      </div>

      <button className="pw-addbtn pw-spinbtn" onClick={drawOne} disabled={spinning || done}>
        {done ? "3試合そろいました" : spinning ? "抽選中…" : `🎰 第${total + 1}試合を決める`}
      </button>
      {spinning && <button className="pw-backlatest" onClick={skip}>結果をすぐ表示</button>}

      {slots.map((slot, gi) => {
        if (slot.kind === "skipped") {
          return (
            <div className="pw-drawcard played" key={`s${gi}${slot.k}`}>
              <div className="pw-drawhead">第{gi + 1}試合</div>
              <div className="pw-playedrow"><b>{pairLabel(slot.k)}</b><span>消化済み</span></div>
            </div>
          );
        }
        const g = slot.kind === "drawn" ? slot.g : blank;
        const pending = slot.kind === "pending";
        const runId = !pending && g.animate ? g.run : 0;
        const inst = instant && g === last;
        return (
          <div className={`pw-drawcard${pending ? " pending" : ""}`} key={pending ? `p${gi}` : `g${g.run}`}>
            <div className="pw-drawhead">第{gi + 1}試合</div>
            <div className="pw-drawrow">
              <div className="pw-drawside">
                <div className="pw-drawlabel first">先攻</div>
                <Reel items={PLAYERS} finalValue={g.first} runId={runId} duration={dur(0)} instant={inst} />
              </div>
              <div className="pw-drawvs">vs</div>
              <div className="pw-drawside">
                <div className="pw-drawlabel">後攻</div>
                <Reel items={PLAYERS} finalValue={g.second} runId={runId} duration={dur(1)} instant={inst} />
              </div>
            </div>
            <div className="pw-drawrow">
              <div className="pw-drawside">
                <div className="pw-drawlabel">先発</div>
                <Reel small items={roster[g.first] || []} finalValue={g.firstStarter} runId={runId} duration={dur(2)} instant={inst} />
              </div>
              <div className="pw-drawvs"></div>
              <div className="pw-drawside">
                <div className="pw-drawlabel">先発</div>
                <Reel small items={roster[g.second] || []} finalValue={g.secondStarter} runId={runId} duration={dur(3)} instant={inst} />
              </div>
            </div>
          </div>
        );
      })}

      {games.length > 0 && (
        <button className="pw-resetbtn" onClick={reset}>リセット（抽選結果を消す）</button>
      )}
    </>
  );
}

// ================= ドラフト（3人の指名を同時に公開する） =================
const NPB_TEAMS = [
  "読売ジャイアンツ", "阪神タイガース", "横浜DeNAベイスターズ", "広島東洋カープ", "中日ドラゴンズ", "東京ヤクルトスワローズ",
  "福岡ソフトバンクホークス", "北海道日本ハムファイターズ", "オリックス・バファローズ", "千葉ロッテマリーンズ", "埼玉西武ライオンズ", "東北楽天ゴールデンイーグルス",
];
const ROUND_LABEL = { 1: "投手", 2: "野手", 3: "投手・野手どちらでも" };
const DRAFT_DEVICE_KEY = "pawapuro_device"; // この端末の目印（名前の取り合いを防ぐ）
let memDeviceId = null;
function getDeviceId() {

// 1つの名前は1つの端末だけが使える。1つの端末が使える名前は1つだけ。
function applyClaim(cur, player, dev) {
  const claims = { ...((cur && cur.claims) || {}) };
  if (claims[player] && claims[player] !== dev) return { error: `${player}は、ほかの端末で使われています` };
  if (PLAYERS.some((q) => q !== player && claims[q] === dev)) return { error: "この端末は、すでに別の名前で使っています" };
  claims[player] = dev;
  return { next: { claims } };
}
function applyRelease(cur, player, dev) {
  const claims = { ...((cur && cur.claims) || {}) };
  if (claims[player] === dev) delete claims[player];
  return { next: { claims } };
}
const DRAFT_MINE_KEY = "pawapuro_draft_mine"; // 自分が入力した内容（この端末だけに保存。他の人を選んでも中身は見えない）
const TEAM_REEL_SEC = 2.4;

}
function saveMine(v) {

// 表記ゆれ（全角半角・空白・髙/高 など）をそろえて、被りを判定する
const normName = (s) =>
  String(s || "")
    .normalize("NFKC")
    .replace(/[\s・･.]/g, "")
    .replace(/髙/g, "高")
    .replace(/﨑/g, "崎")
    .replace(/[邊邉]/g, "辺")
    .toLowerCase();

const allIn = (picks) => PLAYERS.every((p) => picks && picks[p]);

// 3人の指名から結果を決める: 獲得(won) / 被り(clash) / パス(pass)
function resolveRound(picks) {
  const count = {};
  PLAYERS.forEach((p) => {
    if (!picks[p].pass) {
      const k = normName(picks[p].name);
      count[k] = (count[k] || 0) + 1;
    }
  });
  const out = {};
  PLAYERS.forEach((p) => {
    out[p] = picks[p].pass ? "pass" : count[normName(picks[p].name)] > 1 ? "clash" : "won";
  });
  return out;
}

function newDraftState() {
  // 球団は、毎回スロットで1つずつ決める（残りの球団は画面に出さない）
  return { v: 2, remaining: [...NPB_TEAMS], team: null, teamSpin: 0, teamIdx: 0, round: 1, picks: {}, owned: {}, banned: [], done: [], startedAt: new Date().toISOString() };
}

// その球団で、すでに獲得済み・被りで消えた選手は指名できない
function nameProblem(st, name) {
  const k = normName(name);
  if (!k) return "選手名を入力してください";
  if ((st.banned || []).some((b) => normName(b.name) === k)) return `「${name}」は被りで消えた選手なので、誰も指名できません`;
  for (const p of PLAYERS) {
    if (((st.owned || {})[p] || []).some((o) => normName(o.name) === k)) return `「${name}」は${p}がすでに獲得しています`;
  }
  return "";
}

const STALE = "画面が古かったので更新しました。もう一度操作してください";
const sameSpot = (cur, exp) => cur && cur.team && cur.teamIdx === exp.teamIdx && cur.round === exp.round;

function applySubmit(cur, exp, player, pick) {
  if (!sameSpot(cur, exp) || cur.round > 3 || allIn(cur.picks)) return { error: STALE };
  if (!pick.pass) {
    const bad = nameProblem(cur, pick.name);
    if (bad) return { error: bad };
  }
  return { next: { ...cur, picks: { ...(cur.picks || {}), [player]: pick } } };
}
function applyRetract(cur, exp, player) {
  if (!sameSpot(cur, exp) || allIn(cur.picks)) return { error: "全員の入力がそろったので、取り消せません" };
  const picks = { ...(cur.picks || {}) };
  delete picks[player];
  return { next: { ...cur, picks } };
}
// 球団をランダムに1つ決める（誰が押しても、同時に押しても1回だけ決まる）
function applyDrawTeam(cur, exp) {
  if (!cur || cur.teamIdx !== exp.teamIdx || cur.team) return { error: "" }; // すでに決まっているときは何もしない
  const rem = cur.remaining || [];
  if (!rem.length) return { error: "すべての球団が終わっています" };
  const team = rem[Math.floor(Math.random() * rem.length)];
  return { next: { ...cur, team, remaining: rem.filter((t) => t !== team), teamSpin: Date.now() } };
}
// 3人そろった指名を確定して、次の巡へ進む
function applyAdvance(cur, exp) {
  if (!sameSpot(cur, exp) || cur.round > 3) return { error: STALE };
  if (!allIn(cur.picks)) return { error: "まだ全員の入力がそろっていません" };
  const res = resolveRound(cur.picks);
  const owned = {};
  PLAYERS.forEach((p) => {
    owned[p] = [...((cur.owned || {})[p] || [])];
    if (res[p] === "won") owned[p].push({ name: cur.picks[p].name, round: cur.round });
  });
  const banned = [...(cur.banned || [])];
  PLAYERS.forEach((p) => {
    if (res[p] === "clash" && !banned.some((b) => normName(b.name) === normName(cur.picks[p].name))) {
      banned.push({ name: cur.picks[p].name, round: cur.round });
    }
  });
  return { next: { ...cur, owned, banned, picks: {}, round: cur.round + 1 } };
}
// 3巡終わったあと、コスト0の選手を自由に追加する
function applyFill(cur, exp, player, name) {
  if (!sameSpot(cur, exp) || cur.round !== 4) return { error: STALE };
  const bad = nameProblem(cur, name);
  if (bad) return { error: bad };
  const owned = { ...(cur.owned || {}) };
  owned[player] = [...(owned[player] || []), { name, round: 0 }];
  return { next: { ...cur, owned } };
}
// この球団を終わりにして、次の球団へ
function applyNextTeam(cur, exp) {
  if (!sameSpot(cur, exp) || cur.round !== 4) return { error: STALE };
  const finished = { team: cur.team, owned: {} };
  PLAYERS.forEach((p) => { finished.owned[p] = (cur.owned || {})[p] || []; });
  return { next: { ...cur, done: [...(cur.done || []), finished], team: null, teamIdx: cur.teamIdx + 1, round: 1, picks: {}, owned: {}, banned: [] } };
}

const half = (s) => String(s || "").normalize("NFKC");
const rankOf = (v) => (v >= 90 ? "S" : v >= 80 ? "A" : v >= 70 ? "B" : v >= 60 ? "C" : v >= 50 ? "D" : v >= 40 ? "E" : v >= 30 ? "F" : "G");

// 名前で探す（完全一致 → 前方一致 → 部分一致の順）
function findPlayers(list, query, limit) {
  const k = normName(query);
  if (!k || !list) return [];
  const exact = [], head = [], part = [];
  list.forEach((p) => {
    const n = normName(p.name);
    if (n === k) exact.push(p);
    else if (n.startsWith(k)) head.push(p);
    else if (n.includes(k)) part.push(p);
  });
  return [...exact, ...head, ...part].slice(0, limit);
}

// ランクの色（パワプロの画面に合わせる。B・C・D は実際の画面から採色）

// 変化球の図（上=ストレート、左・左下・下・右下・右 の5方向。変化量の分だけ色がつく）
const CHART_COLORS = ["#f9d03c", "#f5a62a", "#ef8a2c", "#e8652d", "#de4a2f", "#c9363f", "#a82a55"];
function PitchChart({ pitches }) {
  const cx = 185, cy = 40;
  const bySlot = {};
  pitches.forEach((x) => { (bySlot[x.slot] = bySlot[x.slot] || []).push(x); });
  const label = (slot) => (bySlot[slot] || []).map((x) => half(x.n));
  const amtOf = (slot) => Math.max(0, ...(bySlot[slot] || []).map((x) => x.amt));
  const dirs = { 1: 180, 2: 135, 3: 90, 4: 45, 5: 0 };
  const lab = (slot, x, y, anchor, room) => {
    const names = label(slot).filter((n) => n && !(slot === 0 && false));
    return names.map((n, i) => {
      const len = [...n].length * 11;
      const fit = room && len > room ? { textLength: room, lengthAdjust: "spacingAndGlyphs" } : {};
      return <text key={slot + n} x={x} y={y + i * 12} textAnchor={anchor} fontSize="11" fill="#222" {...fit}>{n}</text>;
    });
  };
  return (
    <svg className="pw-g-chartsvg" viewBox="0 0 360 170" role="img" aria-label="変化球">
      {Object.entries(dirs).map(([slot, ang]) => {
        const n = amtOf(Number(slot));
        return (
          <g key={slot} transform={`translate(${cx},${cy}) rotate(${ang})`}>
            {[0, 1, 2, 3, 4, 5, 6].map((k) => {
              const x = 11 + k * 13;
              const on = k < n;
              const fill = on ? CHART_COLORS[k] : "#bdeeef";
              const stroke = on ? "#b9741f" : "#4a9bd0";
              return k === 6 ? (
                <polygon key={k} points={`${x},-5 ${x + 8},-5 ${x + 13},0 ${x + 8},5 ${x},5`} fill={fill} stroke={stroke} strokeWidth="1" />
              ) : (
                <rect key={k} x={x} y={-5} width={12} height={10} fill={fill} stroke={stroke} strokeWidth="1" />
              );
            })}
          </g>
        );
      })}
      <circle cx={cx} cy={cy} r="6" fill="#fff" stroke="#777" strokeWidth="1" />
      <path d={`M ${cx - 4} ${cy - 2} q 3 2 0 4 M ${cx + 4} ${cy - 2} q -3 2 0 4`} stroke="#d33" strokeWidth="0.9" fill="none" />
      <polygon points={`${cx - 6},${cy - 17} ${cx + 6},${cy - 17} ${cx + 6},${cy - 22} ${cx},${cy - 27} ${cx - 6},${cy - 22}`} fill="#c0272d" stroke="#8a1b20" strokeWidth="1" />
      {lab(0, cx - 12, cy - 20, "end", 90)}
      {lab(1, cx - 11 - 91 - 6, cy + 4, "end", 76)}
      {lab(5, cx + 11 + 91 + 6, cy + 4, "start", 66)}
      {lab(2, cx - 0.707 * 56 - 8, cy + 0.707 * 56 + 4, "end", 130)}
      {lab(3, cx, cy + 11 + 91 + 18, "middle", 100)}
      {lab(4, cx + 0.707 * 56 + 8, cy + 0.707 * 56 + 4, "start", 120)}
    </svg>
  );
}

// 能力セルの表（5列。上から 評価2行・特殊能力4行・（少し空けて）緑の特殊能力3行）
const cellFont = (t, budget) => Math.max(6.5, Math.min(12, budget / Math.max(1, [...t].length)));
function GCell({ c }) {
  if (!c) return <div className="pw-gc e" />;
  if (c.kind === "g") {
    const g = half(c.g);
    return (
      <div className={`pw-gc g${c.hl ? " hl" : ""}`}>
        <span style={{ fontSize: cellFont(c.n, 40) }}>{c.n}</span>
        <em>{g}</em>
      </div>
    );
  }
  const t = half(c.n);
  return <div className={`pw-gc ${c.kind}`}><span style={{ fontSize: cellFont(t, 56) }}>{t}</span></div>;
}
function fillRows(list, rows) {
  const total = Math.max(rows, Math.ceil(list.length / 5)) * 5;
  const out = [];
  for (let i = 0; i < total; i++) out.push(list[i] || null);
  return out;
}
function AbilityGrid({ grades, specials, tags }) {
  const g = fillRows(grades.map((x) => ({ ...x, kind: "g" })), 2);
  const sp = fillRows(specials.map((x) => ({ n: x.n, kind: x.neg ? "r" : "b" })), 4);
  const tagCells = [];
  const tagRows = Math.max(3, tags.length);
  for (let r = 0; r < tagRows; r++) {
    for (let i = 0; i < 5; i++) {
      const t = (tags[r] || [])[i];
      tagCells.push(t ? { n: t, kind: "t" } : null);
    }
  }
  return (
    <div className="pw-g-grid">
      {[...g, ...sp].map((c, i) => <GCell key={i} c={c} />)}
      <div className="pw-g-gap" />
      {tagCells.map((c, i) => <GCell key={"t" + i} c={c} />)}
    </div>
  );
}

// 名前プレートの色はポジション適性: 先発=赤、中継ぎ・抑え=ピンク、捕手=青、内野手=黄、外野手=緑（複数あれば組み合わせ）
const PLATE = {
  red: ["#ef8f86", "#d9534f"], pink: ["#f093db", "#d84fc9"],
  blue: ["#8cc4f2", "#3f86d8"], yellow: ["#f6de7c", "#c9a227"], green: ["#9ddc8c", "#4aa84a"],
};
function plateKeys(p) {
  const keys = [];
  if (p.kind === "P") {
    const r = p.role ? p.role.main + (p.role.sub || "") : "";
    if (r.includes("先")) keys.push("red");
    if (r.includes("中") || r.includes("抑")) keys.push("pink");
  } else {
    const pos = p.pos || "";
    if (pos.includes("捕")) keys.push("blue");
    if (/[一二三遊]/.test(pos)) keys.push("yellow");
    if (pos.includes("外")) keys.push("green");
  }
  return keys.length ? keys : ["blue"];
}
function plateStyle(p) {
  const keys = plateKeys(p);
  const cols = keys.map((k) => PLATE[k][0]);
  const n = cols.length;
  const bg = n === 1
    ? cols[0]
    : `linear-gradient(100deg, ${cols.map((c, i) => `${c} ${Math.round((i / n) * 100 + (i ? 6 : 0))}%, ${c} ${Math.round(((i + 1) / n) * 100 - (i < n - 1 ? 6 : 0))}%`).join(", ")})`;
  return { background: bg, borderColor: PLATE[keys[n - 1]][1] };
}

function PlayerCard({ p }) {
  const isP = p.kind === "P";
  const [tab, setTab] = useState(isP ? "pit" : "bat");
  const tabs = isP ? [["pit", "投手能力"], ["bat", "野手能力"], ["def", "ポジション適性"]] : [["bat", "野手能力"], ["def", "ポジション適性"]];
  // 投手の成績（防御率・勝敗）と、野手としての成績（打率など）は別のデータ
  const sn = p.season || [];
  const bn = isP ? p.bseason || [] : sn;
  const season = isP && tab === "pit"
    ? `防${sn[0] || "---"}　${sn[1] || "--"}勝　${sn[2] || "--"}敗　${sn[3] || "--"}HP　${sn[4] || "-"}S`
    : `打${bn[0] || "---"}　${bn[1] || "--"}本　${bn[2] || "--"}点　${bn[3] || "--"}盗`;
  const info = isP && tab === "pit" ? `${p.form}　${p.hand}` : `${p.type}　${p.hand}`;
  const chars = [...p.name];
  const defs = [["投手", "投"], ["捕手", "捕"], ["一塁", "一"], ["二塁", "二"], ["三塁", "三"], ["遊撃", "遊"], ["外野", "外"]];
  return (
    <div className={`pw-g t-${tab}`}>
      <div className="pw-g-tabs">
        {tabs.map(([k, label]) => (
          <button key={k} className={`pw-g-tab ${k}${tab === k ? " on" : ""}`} onClick={() => setTab(k)}>{label}</button>
        ))}
      </div>
      <div className="pw-g-body">
        <div className="pw-g-top">
          <div className="pw-g-plate" style={{ letterSpacing: chars.length <= 3 ? "0.45em" : "0.05em", ...plateStyle(p) }}>{p.name}</div>
          <div className="pw-g-no">{p.no}</div>
          <div className="pw-g-info">{info}</div>
        </div>
        <div className="pw-g-info wide">{season}</div>

        {tab === "pit" && (
          <>
            <div className="pw-g-row4">
              <GBox label="球 速"><div className="pw-g-speed">{p.velo}<small>km/h</small></div></GBox>
              <GBox label="コントロール"><RankVal v={p.ctrl} /></GBox>
              <GBox label="スタミナ"><RankVal v={p.stam} /></GBox>
              <GBox label="適 正"><Role r={p.role} /></GBox>
            </div>
            <div className="pw-g-chart"><PitchChart pitches={p.pitches || []} /></div>
            <AbilityGrid grades={p.pg || []} specials={p.ps || []} tags={p.pt || []} />
          </>
        )}
        {tab === "bat" && (
          <>
            <div className="pw-g-row4">
              <GBox label="弾 道"><div className="pw-g-speed">{p.trj}</div></GBox>
              <GBox label="ミート"><RankVal v={p.meet} /></GBox>
              <GBox label="パワー"><RankVal v={p.pow} /></GBox>
              <GBox label="走 力"><RankVal v={p.spd} /></GBox>
              <GBox label="肩 力"><RankVal v={p.arm} /></GBox>
              <GBox label="守備力"><RankVal v={p.def} /></GBox>
              <GBox label="捕 球"><RankVal v={p.catch} /></GBox>
            </div>
            <AbilityGrid grades={p.bg || []} specials={p.bs || []} tags={p.bt || []} />
          </>
        )}
        {tab === "def" && (
          <div className="pw-g-row4">
            {defs.map(([label, key]) => (
              <GBox key={key} label={label} dim={p.defpos[key] === undefined}>
                {p.defpos[key] === undefined ? <div className="pw-g-none">－</div> : <RankVal v={p.defpos[key]} />}
              </GBox>
            ))}

        )}
      </div>
    </div>
  );
}

// 入力中の文字から選手候補を出す。名前がぴったり合ったら能力カードを出す。
function PlayerSuggest({ list, query, st, onPick }) {
  if (!list || !query.trim()) return null;
  const k = normName(query);
  const hits = findPlayers(list, query, 6);
  const exact = hits.find((p) => normName(p.name) === k) || null;
  return (
    <div className="pw-sug">
      {hits.length === 0 && <div className="pw-sug-none">この球団の選手データに、該当する選手がいません</div>}
      {hits.map((p) => {
        const taken = st ? nameProblem(st, p.name) : "";
        return (
          <button key={p.name} className={`pw-sug-row${exact === p ? " on" : ""}`} disabled={!!taken} onClick={() => onPick(p.name)}>
            <b>{p.name}</b>
            <span>{p.kind === "P" ? `投手 ${roleText(p)}` : p.pos}</span>
            <span>{p.hand}</span>
            {taken && <em>指名不可</em>}
          </button>
        );
      })}
      {exact && <PlayerCard key={exact.name} p={exact} />}
    </div>
  );
}

// 選手の能力を調べるパネル（誰でも、いつでも使える）
function PlayerLookup() {
  const db = usePlayerDb();
  const teams = db ? Object.keys(db) : [];
  const [team, setTeam] = useState("");
  const [q, setQ] = useState("");
  const [sel, setSel] = useState(null);
  const cur = team && db && db[team] ? team : teams[0] || "";
  const list = cur ? db[cur] : [];
  const hits = q.trim() ? findPlayers(list, q, 8) : list.slice(0, 0);
  const picked = sel && list.find((p) => p.name === sel);
  return (
    <details className="pw-dr-hist pw-lookup">
      <summary>選手の能力を調べる</summary>
      {db === null && <div className="pw-sug-none">読み込み中…</div>}
      {db !== null && teams.length === 0 && <div className="pw-sug-none">選手データを読み込めませんでした</div>}
      {teams.length > 0 && (
        <>
          {teams.length > 1 ? (
            <div className="pw-chips" style={{ margin: "8px 0" }}>
              {teams.map((t) => <button key={t} className={`pw-chip${t === cur ? " on" : ""}`} onClick={() => { setTeam(t); setSel(null); }}>{t}</button>)}
            </div>
          ) : (
            <div className="pw-sug-none" style={{ marginTop: 8 }}>{cur}（{list.length}人）</div>
          )}
          <input className="pw-dr-input pw-lk-input" value={q} onChange={(e) => { setQ(e.target.value); setSel(null); }} placeholder="選手名で検索" />
          {hits.map((p) => (
            <button key={p.name} className={`pw-sug-row${sel === p.name ? " on" : ""}`} onClick={() => setSel(p.name)}>
              <b>{p.name}</b>
              <span>{p.kind === "P" ? `投手 ${roleText(p)}` : p.pos}</span>
              <span>{p.hand}</span>
            </button>
          ))}
          {!q.trim() && (
            <div className="pw-lk-all">
              {list.map((p) => (
                <button key={p.name} className={`pw-lk-name${sel === p.name ? " on" : ""}${p.kind === "P" ? " p" : ""}`} onClick={() => setSel(p.name)}>{p.name}</button>
              ))}
            </div>
          )}
          {picked && <PlayerCard key={picked.name} p={picked} />}
        </>
      )}
    </details>
  );
}

function DraftTab() {
  const [st, setSt] = useState(undefined); // undefined=読み込み中 / null=まだ始まっていない
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [text, setText] = useState("");
  const [fillText, setFillText] = useState("");
  const deviceId = useRef(null);
  if (deviceId.current === null) deviceId.current = getDeviceId();
  const [claims, setClaims] = useState(undefined); // どの名前をどの端末が使っているか
  const playerDb = usePlayerDb(); // 選手データ（能力）
  const me = claims ? PLAYERS.find((p) => claims[p] === deviceId.current) || null : null;

  // 球団が決まるときだけスロットを回す（開いた時点で決まっていた球団はそのまま表示）
  const initSpin = useRef(undefined);
  const [doneSpin, setDoneSpin] = useState(0);
  useEffect(() => {
    if (st === undefined || initSpin.current !== undefined) return;
    initSpin.current = st ? st.teamSpin || 0 : 0;
  }, [st]);
  const animSpin =
    st && st.teamSpin && initSpin.current !== undefined && st.teamSpin !== initSpin.current && !prefersReducedMotion() ? st.teamSpin : 0;
  useEffect(() => {
    if (!animSpin) return;
    const t = setTimeout(() => setDoneSpin(animSpin), TEAM_REEL_SEC * 1000 + 500);
    return () => clearTimeout(t);
  }, [animSpin]);
  const revealing = !!animSpin && doneSpin !== animSpin;

  useEffect(() => {
    let unsub = null;
    let unsub2 = null;
    const start = () => {
      unsub = window.fb.draftSubscribe(setSt, () => setErr("ドラフトの情報を読み込めませんでした"));
      unsub2 = window.fb.claimsSubscribe((d) => setClaims((d && d.claims) || {}), () => setErr("ドラフトの情報を読み込めませんでした"));
    };
    if (window.fb) start();
    else window.addEventListener("fb-ready", start, { once: true });
    return () => { if (unsub) unsub(); if (unsub2) unsub2(); };
  }, []);

  async function claimName(p) {
    setErr("");
    try {
      const r = await window.fb.claimsTx((cur) => applyClaim(cur, p, deviceId.current));
      if (r && r.error) setErr(r.error);
    } catch {
      setErr("通信に失敗しました。もう一度試してください");
    }
  }
  async function releaseName() {
    if (!window.confirm(`この端末の「${me}」の名前を解除しますか？（別の名前を選び直せます）`)) return;
    try { await window.fb.claimsTx((cur) => applyRelease(cur, me, deviceId.current)); } catch { setErr("通信に失敗しました。もう一度試してください"); }
  }
  async function run(mutator) {
    setBusy(true);
    setErr("");
    let ok = false;
    try {
      const r = await window.fb.draftTx(mutator);
      if (r && r.error) setErr(r.error);
      else ok = true;
    } catch {
      setErr("通信に失敗しました。もう一度試してください");
    }
    setBusy(false);
    return ok;
  }

  if (st === undefined || claims === undefined) return <div className="pw-drawintro">読み込み中…</div>;

  // --- 自分は誰か（1つの名前は1つの端末だけ。ドラフトの最中は変更できない） ---
  const draftRunning = !!st && !(Array.isArray(st.remaining) && st.teamIdx >= NPB_TEAMS.length);
  const mePicker = me ? (
    <div className="pw-dr-me">
      <span>あなたは</span>
      <span className="pw-chip on">{me}</span>
      {!draftRunning && <button className="pw-backlatest pw-dr-change" onClick={releaseName}>名前を変更</button>}
      {draftRunning && <small className="pw-dr-hint">ドラフトの最中は、名前を変更できません。</small>}
    </div>
  ) : (
    <div className="pw-dr-me">
      <span>あなたは</span>
      {PLAYERS.map((p) => {
        const taken = !!claims[p];
        return (
          <button key={p} className="pw-chip" onClick={() => claimName(p)} disabled={taken} title={taken ? "ほかの端末で使用中" : ""}>
            {p}{taken ? "（使用中）" : ""}
          </button>
        );
      })}
      <small className="pw-dr-hint">自分の名前を選ぶと、この端末はその名前に固定されます。ほかの人の名前では入力できません。</small>
    </div>
  );

  const lookup = <PlayerLookup />;

  // --- まだ始まっていない ---
  if (st === null) {
    return (
      <>
        <div className="pw-drawintro">
          3人がそれぞれの端末で指名を入力します。全員の入力がそろった瞬間に、3人の画面で同時に公開されます。被りも自動で判定します。球団は、1球団ごとにスロットで決まります。
        </div>
        {mePicker}
        <button className="pw-addbtn pw-spinbtn" onClick={() => run((cur) => (cur ? { error: "すでに始まっています" } : { next: newDraftState() }))} disabled={busy}>
          ドラフトを始める
        </button>
        {err && <div className="pw-dr-err">{err}</div>}
        {lookup}
      </>
    );
  }

  // 古い形式のデータ（球団の順番を先に決める方式）は、やり直してもらう
  if (!Array.isArray(st.remaining)) {
    return (
      <>
        <div className="pw-drawintro">ドラフトの仕組みが新しくなりました。最初からやり直してください。</div>
        <button className="pw-resetbtn" onClick={async () => { await window.fb.draftReset(); }}>ドラフトをやり直す</button>
      </>
    );
  }
  const total = NPB_TEAMS.length;
  const finished = st.teamIdx >= total;
  const picks = st.picks || {};
  const owned = st.owned || {};
  const exp = { teamIdx: st.teamIdx, round: st.round };
  const everyone = allIn(picks);
  const res = everyone && st.round <= 3 ? resolveRound(picks) : null;
  const spot = `${st.teamIdx}-${st.round}`;
  const team = st.team;
  // 自分の入力内容は、この端末に残した記録があるときだけ表示・取り消しできる
  const mineLocal = (() => {
    const m = loadMine();
    return m && me && m.player === me && m.spot === spot && picks[me] ? m : null;
  })();
  const STATUS = { won: "獲得", clash: "被り", pass: "パス" };

  function submit(pass) {
    if (!me) { setErr("先に「あなたは」を選んでください"); return; }
    const name = text.trim();
    if (!pass) {
      const bad = nameProblem(st, name);
      if (bad) { setErr(bad); return; }
      if (name.length > 30) { setErr("選手名が長すぎます"); return; }
    }
    run((cur) => applySubmit(cur, exp, me, pass ? { name: "", pass: true } : { name, pass: false })).then((ok) => {
      if (ok) { saveMine({ spot, player: me, name, pass: !!pass }); setText(""); }
    });
  }
  function addFill() {
    const name = fillText.trim();
    if (!me) { setErr("先に「あなたは」を選んでください"); return; }
    const bad = nameProblem(st, name);
    if (bad) { setErr(bad); return; }
    run((cur) => applyFill(cur, exp, me, name)).then((ok) => { if (ok) setFillText(""); });
  }
  async function resetAll() {
    if (!window.confirm("ドラフトを最初からやり直しますか？（これまでの獲得結果は消えます）")) return;
    setBusy(true);
    try { await window.fb.draftReset(); } catch { setErr("通信に失敗しました。もう一度試してください"); }
    setBusy(false);
  }

  const history = (st.done || []).length > 0 && (
    <details className="pw-dr-hist">
      <summary>終わった球団（{st.done.length}/{total}）</summary>
      {st.done.map((d, i) => (
        <div className="pw-dr-histteam" key={i}>
          <div className="pw-dr-histname">{d.team}</div>
          {PLAYERS.map((p) => (
            <div className="pw-dr-histrow" key={p}><b>{p}</b><span>{((d.owned || {})[p] || []).map((o) => o.name).join("、") || "—"}</span></div>
          ))}
        </div>
      ))}
    </details>
  );

  // --- 全球団おわり ---
  if (finished) {
    return (
      <>
        <div className="pw-dr-title">ドラフト終了 🎉</div>
        <div className="pw-drawintro">12球団すべて終わりました。</div>
        {lookup}
        {history}
        <button className="pw-resetbtn" onClick={resetAll} disabled={busy}>新しいドラフトを始める（結果を消す）</button>
      </>
    );
  }

  const ownedPanel = (
    <div className="pw-dr-owned">
      <div className="pw-dr-sub">この球団の獲得</div>
      {PLAYERS.map((p) => (
        <div className="pw-dr-ownedrow" key={p}>
          <b>{p}</b>
          <span>{(owned[p] || []).map((o) => o.name + (o.round === 0 ? "（コスト0）" : "")).join("、") || "—"}</span>
        </div>
      ))}
      {(st.banned || []).length > 0 && (
        <div className="pw-dr-banned">
          <small>被りで誰も指名できない選手</small>
          <div>{st.banned.map((b) => b.name).join("、")}</div>
        </div>
      )}
    </div>
  );

  const header = (
    <div className="pw-dr-team">
      <small>{st.teamIdx + 1} / {total} 球団目</small>
      <Reel key={`team-${st.teamIdx}-${st.teamSpin}`} items={NPB_TEAMS} finalValue={team || "?"} runId={team ? animSpin : 0} duration={TEAM_REEL_SEC} />
    </div>
  );

  // --- 球団がまだ決まっていない: スロットで決める ---
  if (!team) {
    return (
      <>
        {mePicker}
        {header}
        <button className="pw-addbtn pw-spinbtn" onClick={() => run((cur) => applyDrawTeam(cur, exp))} disabled={busy}>
          🎰 球団を決める
        </button>
        {err && <div className="pw-dr-err">{err}</div>}
        {lookup}
        {history}
        <button className="pw-resetbtn" onClick={resetAll} disabled={busy}>ドラフトを最初からやり直す</button>
      </>
    );
  }

  // --- スロットが回っている間は、球団だけを見せる ---
  if (revealing) {
    return (
      <>
        {mePicker}
        {header}
      </>
    );
  }

  // --- 3巡終わり: コスト0の補充 ---
  if (st.round > 3) {
    return (
      <>
        {mePicker}
        {header}
        <div className="pw-dr-roundtag">3巡終了</div>
        {ownedPanel}
        <div className="pw-dr-fill">
          {PLAYERS.map((p) => {
            const need = Math.max(0, 2 - (owned[p] || []).length);
            return (
              <div className="pw-dr-fillrow" key={p}>
                <b>{p}</b>
                <span className={need > 0 ? "need" : ""}>{need > 0 ? `あと${need}名、コスト0から自由に獲得` : "OK（2名以上）"}</span>
              </div>
            );
          })}
        </div>
        {me && (owned[me] || []).length < 3 && (
          <div className="pw-dr-inputrow">
            <input className="pw-dr-input" value={fillText} onChange={(e) => setFillText(e.target.value)} placeholder={`${me}: コスト0で獲得する選手名`} maxLength={30} />
            <button className="pw-dr-send" onClick={addFill} disabled={busy || !fillText.trim()}>追加</button>
          </div>
        )}
        {me && (owned[me] || []).length < 3 && <PlayerSuggest list={(playerDb || {})[team]} query={fillText} st={st} onPick={setFillText} />}
        {err && <div className="pw-dr-err">{err}</div>}
        <button className="pw-addbtn pw-spinbtn" onClick={() => run((cur) => applyNextTeam(cur, exp))} disabled={busy}>
          {st.teamIdx + 1 < total ? "この球団を終わって次へ" : "ドラフトを終了する"}
        </button>
        {lookup}
        {history}
        <button className="pw-resetbtn" onClick={resetAll} disabled={busy}>ドラフトを最初からやり直す</button>
      </>
    );
  }

  // --- 1〜3巡目 ---
  return (
    <>
      {mePicker}
      {header}
      <div className="pw-dr-roundtag">第{st.round}巡 — {ROUND_LABEL[st.round]}</div>

      {!everyone && (
        <>
          <div className="pw-dr-status">
            {PLAYERS.map((p) => (
              <div key={p} className={`pw-dr-stat${picks[p] ? " in" : ""}`}>
                <b>{p}</b>
                <span>{picks[p] ? "✓ 入力済み" : "入力中…"}</span>
              </div>
            ))}
          </div>
          {me && picks[me] ? (
            <div className="pw-dr-mine">
              {mineLocal ? (
                <>
                  <div><small>あなたの指名</small><b>{mineLocal.pass ? "パス" : mineLocal.name}</b></div>
                  <button className="pw-backlatest" onClick={() => { run((cur) => applyRetract(cur, exp, me)).then((ok) => { if (ok) saveMine(null); }); }} disabled={busy}>取り消して入力しなおす</button>
                </>
              ) : (
                <div><small>{me}</small><b>✓ 入力済み</b></div>
              )}
              <div className="pw-dr-wait">みんなの入力を待っています。そろうと、全員の画面で同時に公開されます。</div>
            </div>
          ) : (
            <>
              <div className="pw-dr-inputrow">
                <input
                  className="pw-dr-input"
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  onKeyDown={(e) => { if (e.key === "Enter" && !busy) submit(false); }}
                  placeholder={me ? `${me}: 指名する選手名（${ROUND_LABEL[st.round]}）` : "先に「あなたは」を選んでください"}
                  maxLength={30}
                />
                <button className="pw-dr-send" onClick={() => submit(false)} disabled={busy || !me || !text.trim()}>指名</button>
              </div>
              <PlayerSuggest list={(playerDb || {})[team]} query={text} st={st} onPick={setText} />
              <button className="pw-dr-pass" onClick={() => submit(true)} disabled={busy || !me}>指名しない（パス）</button>
            </>
          )}
        </>
      )}

      {everyone && res && (
        <>
          <div className="pw-dr-reveal">
            {PLAYERS.map((p, i) => (
              <div key={`${st.teamIdx}-${st.round}-${p}`} className={`pw-dr-card ${res[p]}`} style={{ animationDelay: `${i * 0.45}s` }}>
                <div className="pw-dr-who">{p}</div>
                <div className="pw-dr-name">{picks[p].pass ? "パス" : picks[p].name}</div>
                <div className="pw-dr-badge">{STATUS[res[p]]}</div>
              </div>
            ))}
          </div>
          <button className="pw-addbtn pw-spinbtn" onClick={() => run((cur) => applyAdvance(cur, exp))} disabled={busy}>
            {st.round < 3 ? `第${st.round + 1}巡へ` : "3巡終了へ"}
          </button>
        </>
      )}

      {err && <div className="pw-dr-err">{err}</div>}
      {ownedPanel}
      {lookup}
      {history}
      <button className="pw-resetbtn" onClick={resetAll} disabled={busy}>ドラフトを最初からやり直す</button>
    </>
  );
}

// ---- 画面 -------------------------------------------------------------

function PawapuroScorebook() {
  const [games, setGames] = useState([]);
  const [currentLeague, setCurrentLeague] = useState(1);
  const [rosters, setRosters] = useState({});
  const [viewingLeague, setViewingLeague] = useState(1);
  const [followLatest, setFollowLatest] = useState(true);
  const [tab, setTab] = useState("league");
  const [tabBeforeDraw, setTabBeforeDraw] = useState("league");
  const [statsScope, setStatsScope] = useState("all");
  const [showAllPitchers, setShowAllPitchers] = useState(false);
  const [loading, setLoading] = useState(true);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(emptyForm());
  const [error, setError] = useState("");
  const [saveError, setSaveError] = useState("");
  const [ready, setReady] = useState(!!window.fb);
  const [rosterDraft, setRosterDraft] = useState(null);
  const [importedPast, setImportedPast] = useState(true); // 読み込みが終わるまでは取り込みボタンを出さない
  const [importBusy, setImportBusy] = useState(false);
  const showImport = /[?&]import=1/.test(window.location.search);

  function applyData(d) {
    setGames(d.games);
    setCurrentLeague(d.currentLeague);
    setRosters(d.rosters || {});
    setImportedPast(!!d.importedPast);
  }

  useEffect(() => {
    if (window.fb) { setReady(true); return; }
    const onReady = () => setReady(true);
    window.addEventListener("fb-ready", onReady);
    return () => window.removeEventListener("fb-ready", onReady);
  }, []);

  useEffect(() => {
    if (!ready) return;
    let unsub;
    (async () => {
      try {
        const initial = await window.fb.load();
        applyData(initial);
        setViewingLeague(initial.currentLeague);
      } catch {
        setSaveError("データの読み込みに失敗しました。設定（firebaseConfig）を確認してください。");
      } finally {
        setLoading(false);
      }
      unsub = window.fb.subscribe((data) => applyData(data));
    })();
    return () => unsub && unsub();
  }, [ready]);

  useEffect(() => {
    if (followLatest) setViewingLeague(currentLeague);
  }, [currentLeague, followLatest]);

  function prevLeague() {
    setFollowLatest(false);
    setViewingLeague((v) => Math.max(1, v - 1));
  }
  function nextLeague() {
    setViewingLeague((v) => {
      const next = Math.min(currentLeague, v + 1);
      setFollowLatest(next === currentLeague);
      return next;
    });
  }
  function backToLatest() {
    setFollowLatest(true);
    setViewingLeague(currentLeague);
  }

  // ---- リーグ画面の集計 ----
  const leagueGames = useMemo(
    () => games.filter((g) => (g.league || 1) === viewingLeague),
    [games, viewingLeague]
  );
  const standings = useMemo(() => computeTally(leagueGames), [leagueGames]);

  const wins = PLAYERS.map((p) => standings[p].win);
  const topWin = Math.max(...wins);
  const bottomWin = Math.min(...wins);
  const gap = topWin - bottomWin;
  const gapLevel = gap >= 5 ? "critical" : gap >= 3 ? "warn" : "normal";

  const sortedGames = useMemo(
    () => [...leagueGames].sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : (y.id || 0) - (x.id || 0))),
    [leagueGames]
  );

  // ---- 通算画面の集計 ----
  const champions = useMemo(() => computeChampions(games, currentLeague), [games, currentLeague]);
  const statsGames = useMemo(
    () => (statsScope === "all" ? games : games.filter((g) => (g.league || 1) === Number(statsScope))),
    [games, statsScope]
  );
  const statsTally = useMemo(() => computeTally(statsGames), [statsGames]);
  const statsH2H = useMemo(() => computeH2H(statsGames), [statsGames]);
  const statsPitchers = useMemo(() => computePitchers(statsGames), [statsGames]);
  const rankCounts = useMemo(() => {
    const c = Object.fromEntries(PLAYERS.map((p) => [p, [0, 0, 0]]));
    Object.keys(champions).forEach((l) => {
      if (statsScope !== "all" && Number(l) !== Number(statsScope)) return;
      const t = computeTally(games.filter((g) => (g.league || 1) === Number(l)));
      PLAYERS.forEach((p) => {
        const rank = 1 + PLAYERS.filter((q) => t[q].win > t[p].win).length;
        c[p][rank - 1] += 1;
      });
    });
    return c;
  }, [games, champions, statsScope]);
  const titleCount = useMemo(() => {
    const c = Object.fromEntries(PLAYERS.map((p) => [p, 0]));
    Object.values(champions).forEach((list) => list.forEach((p) => { c[p] += 1; }));
    return c;
  }, [champions]);

  const currentRoster = getRosterFor(rosters, currentLeague);
  const formRoster = getRosterFor(rosters, currentLeague);

  // ---- フォーム ----
  function updateForm(key, val) {
    setForm((f) => ({ ...f, [key]: val }));
  }
  function changePlayerA(val) { setForm((f) => ({ ...f, playerA: val, starterA: "" })); }
  function changePlayerB(val) { setForm((f) => ({ ...f, playerB: val, starterB: "" })); }

  // 常に最新のデータを読み直してから書き込む（3人が別々に使っても上書きしない）
  async function persistAll(mutate) {
    try {
      const latest = await window.fb.load();
      const next = mutate(latest);
      await window.fb.save(next);
      applyData(next);
      setSaveError("");
      return next;
    } catch {
      setSaveError("保存に失敗しました。通信環境を確認してもう一度お試しください。");
      return null;
    }
  }

  async function submitForm(e) {
    e.preventDefault();
    if (form.playerA === form.playerB) { setError("対戦相手が同じ人になっています。"); return; }
    if (form.scoreA === "" || form.scoreB === "") { setError("点数を入力してください。"); return; }
    setError("");
    const newGame = {
      id: Date.now(),
      date: form.date,
      playerA: form.playerA,
      playerB: form.playerB,
      scoreA: Number(form.scoreA),
      scoreB: Number(form.scoreB),
      starterA: form.starterA,
      starterB: form.starterB,
      cold: form.cold,
      league: currentLeague,
    };
    await persistAll((latest) => ({ ...latest, games: [...latest.games, newGame] }));
    setForm(emptyForm());
    setShowForm(false);
  }

  async function deleteGame(id) {
    await persistAll((latest) => ({ ...latest, games: latest.games.filter((g) => g.id !== id) }));
  }

  // ---- リーグ移行 ----
  function openRosterEditor(league, rostersObj) {
    const r = getRosterFor(rostersObj, league);
    const draft = {};
    PLAYERS.forEach((p) => {
      draft[p] = Array.from({ length: ROSTER_SIZE }, (_, i) => (r[p] && r[p][i]) || "");
    });
    setRosterDraft(draft);
  }

  async function startNewLeague() {
    const ok = window.confirm(
      `第${currentLeague}期を終了して、第${currentLeague + 1}期を始めますか？\nこれまでの記録は消えず、「通算成績」にも反映されます。`
    );
    if (!ok) return;
    const next = await persistAll((latest) => {
      const n = latest.currentLeague + 1;
      const prevRoster = getRosterFor(latest.rosters, latest.currentLeague);
      return {
        ...latest,
        currentLeague: n,
        rosters: { ...latest.rosters, [n]: prevRoster },
      };
    });
    if (!next) return;
    setFollowLatest(true);
    setViewingLeague(next.currentLeague);
    setTab("league");
    // 新しいチームの先発メンバーをすぐ登録できるように編集画面を開く
    openRosterEditor(next.currentLeague, next.rosters);
  }

  async function importPastLeagues() {
    const ok = window.confirm(
      "過去の第1〜3期（43試合）を取り込みます。\n今入っている記録は第4期以降として残ります。\n取り込みは1回だけです。よろしいですか？"
    );
    if (!ok) return;
    setImportBusy(true);
    try {
      const latest = await window.fb.load();
      const already = latest.importedPast || latest.games.some((g) => g.id >= 100000 && g.id < 200000);
      if (already) {
        window.alert("すでに取り込み済みです。");
        applyData({ ...latest, importedPast: true });
        return;
      }
      await window.fb.saveBackup(latest);
      const next = buildImport(latest);
      await window.fb.save(next);
      applyData(next);
      setFollowLatest(true);
      setViewingLeague(next.currentLeague);
      setSaveError("");
      window.alert("取り込みました。「通算成績」タブで確認してください。");
    } catch {
      setSaveError("取り込みに失敗しました。通信環境を確認してもう一度お試しください。（データは変更されていません）");
    } finally {
      setImportBusy(false);
    }
  }

  function updateDraft(player, idx, val) {
    setRosterDraft((d) => ({ ...d, [player]: d[player].map((v, i) => (i === idx ? val : v)) }));
  }

  async function saveRoster() {
    const cleaned = {};
    PLAYERS.forEach((p) => {
      cleaned[p] = rosterDraft[p].map((s) => s.trim()).filter((s) => s !== "");
    });
    const next = await persistAll((latest) => ({
      ...latest,
      rosters: { ...latest.rosters, [latest.currentLeague]: cleaned },
    }));
    if (next) {
      setRosterDraft(null);
      setForm(emptyForm());
    }
  }

  // 右上のサイコロ: 抽選画面を開く／もう一度押すと元のタブに戻る
  function toggleSpecial(name) {
    if (tab === name) { setTab(tabBeforeDraw); return; }
    if (tab !== "draw" && tab !== "draft") setTabBeforeDraw(tab);
    setTab(name);
  }

  const isLatest = viewingLeague === currentLeague;
  const shownPitchers = showAllPitchers ? statsPitchers : statsPitchers.slice(0, 10);
  const topPitcherWin = statsPitchers.length ? statsPitchers[0].win : 0;

  return (
    <div className="pw-root">
      <div className="pw-header">
        <div className="pw-title">
          パワスタ
          <small>左座 / 長谷川 / 正覚 — 成績帳</small>
        </div>
        <div className="pw-hbtns">
        <button
          className={`pw-dicebtn${tab === "draft" ? " on" : ""}`}
          onClick={() => toggleSpecial("draft")}
          aria-label="ドラフト"
          aria-pressed={tab === "draft"}
          title="ドラフト"
        >
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" aria-hidden="true">
            <rect x="5" y="4.5" width="14" height="16.5" rx="2.5" />
            <path d="M9 4.5V3.5h6v1" />
            <path d="M8.5 11l1.6 1.6L13 9.5" />
            <path d="M8.5 17h7" />
          </svg>
        </button>
        <button
          className={`pw-dicebtn${tab === "draw" ? " on" : ""}`}
          onClick={() => toggleSpecial("draw")}
          aria-label="試合抽選"
          aria-pressed={tab === "draw"}
          title="試合抽選"
        >
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinejoin="round" aria-hidden="true">
            <rect x="3.5" y="3.5" width="17" height="17" rx="3.5" />
            <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none" />
            <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none" />
            <circle cx="8.5" cy="15.5" r="1.3" fill="currentColor" stroke="none" />
            <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none" />
          </svg>
        </button>
        </div>
      </div>

      {saveError && <div className="pw-savewarn">{saveError}</div>}

      {showImport && !importedPast && !loading && (
        <div className="pw-importbox">
          <div className="pw-importtitle">過去の大会を取り込む</div>
          <div className="pw-importtext">
            第1期・第2期・第3期（計43試合）を追加します。いま入っている記録は、第{PAST_LEAGUE_COUNT + 1}期以降として残ります。取り込みは1回だけです。
          </div>
          <button className="pw-submit" onClick={importPastLeagues} disabled={importBusy}>
            {importBusy ? "取り込み中…" : "過去の3大会を取り込む"}
          </button>
        </div>
      )}

      <div className="pw-tabs">
        <button className={`pw-tab${tab === "league" ? " on" : ""}`} onClick={() => setTab("league")}>リーグ</button>
        <button className={`pw-tab${tab === "stats" ? " on" : ""}`} onClick={() => setTab("stats")}>通算成績</button>
      </div>

      {tab === "league" && (
        <>
          <div className="pw-leaguebar">
            <button className="pw-leaguenav" onClick={prevLeague} disabled={viewingLeague <= 1}>‹</button>
            <div className="pw-leaguelabel">
              第{viewingLeague}期
              {!isLatest && <span className="pw-leaguepast">過去のリーグ</span>}
            </div>
            <button className="pw-leaguenav" onClick={nextLeague} disabled={viewingLeague >= currentLeague}>›</button>
          </div>
          {!isLatest && (
            <button className="pw-backlatest" onClick={backToLatest}>最新の第{currentLeague}期に戻る</button>
          )}

          <div className="pw-board">
            {PLAYERS.map((p) => {
              const s = standings[p];
              const rate = pct(s.win, s.lose);
              const isLeader = s.win === topWin && topWin > bottomWin;
              return (
                <div className={`pw-cell${isLeader ? " leader" : ""}`} key={p}>
                  <div className="name">{isLeader && "🏆 "}{p}</div>
                  <div className="record">{s.win}<span className="sep">-</span>{s.lose}</div>
                  <div className="rate">勝率 {rate}{s.draw ? ` / 分${s.draw}` : ""}</div>
                </div>
              );
            })}
          </div>

          <div className={`pw-gap ${gapLevel}`}>
            <span>首位差</span>
            <span className="pw-gap-num">{gap}</span>
            <span>勝</span>
            {gap >= 5 && <span className="pw-gap-tag">🏁 決着ライン到達</span>}
          </div>

          {isLatest && (
            <div className="pw-actions">
              <button className="pw-newleague" onClick={startNewLeague}>
                {gap >= 5 ? "🏆 このリーグを終了して次のリーグへ" : "リーグを終了して次のリーグへ"}
              </button>
              <button className="pw-rosterbtn" onClick={() => openRosterEditor(currentLeague, rosters)}>
                第{currentLeague}期の先発メンバーを編集
              </button>
            </div>
          )}

          {isLatest && rosterDraft && (
            <div className="pw-form">
              <div className="pw-form-head">
                <span>第{currentLeague}期 先発メンバー</span>
                <button type="button" onClick={() => setRosterDraft(null)}>✕</button>
              </div>
              <div className="pw-rosterhint">チームが変わったら、それぞれの先発6人を入力してください（空欄は無視されます）。過去の記録は変わりません。</div>
              <div className="pw-rostergrid">
                {PLAYERS.map((p) => (
                  <div key={p}>
                    <div className="pw-rostername">{p}</div>
                    {rosterDraft[p].map((val, i) => (
                      <input
                        key={i}
                        className="pw-input pw-rosterinput"
                        type="text"
                        placeholder={`${i + 1}`}
                        value={val}
                        onChange={(e) => updateDraft(p, i, e.target.value)}
                      />
                    ))}
                  </div>
                ))}
              </div>
              <button className="pw-submit" type="button" onClick={saveRoster}>この内容で保存</button>
            </div>
          )}

          {isLatest ? (
            !showForm && (
              <button className="pw-addbtn" onClick={() => setShowForm(true)}>＋ 試合を記録する</button>
            )
          ) : (
            <div className="pw-empty">過去のリーグは閲覧のみです。記録するには最新のリーグに戻ってください。</div>
          )}

          {showForm && isLatest && (
            <form className="pw-form" onSubmit={submitForm}>
              <div className="pw-form-head">
                <span>試合を記録</span>
                <button type="button" onClick={() => { setShowForm(false); setError(""); }}>✕</button>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">日付</label>
                  <input className="pw-input" type="date" value={form.date} onChange={(e) => updateForm("date", e.target.value)} />
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">プレイヤーA</label>
                  <select className="pw-select" value={form.playerA} onChange={(e) => changePlayerA(e.target.value)}>
                    {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="pw-vs">vs</div>
                <div>
                  <label className="pw-label">プレイヤーB</label>
                  <select className="pw-select" value={form.playerB} onChange={(e) => changePlayerB(e.target.value)}>
                    {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">{form.playerA} 得点</label>
                  <input className="pw-input" type="number" inputMode="numeric" value={form.scoreA} onChange={(e) => updateForm("scoreA", e.target.value)} />
                </div>
                <div>
                  <label className="pw-label">{form.playerB} 得点</label>
                  <input className="pw-input" type="number" inputMode="numeric" value={form.scoreB} onChange={(e) => updateForm("scoreB", e.target.value)} />
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">{form.playerA} 先発</label>
                  <select className="pw-select" value={form.starterA} onChange={(e) => updateForm("starterA", e.target.value)}>
                    <option value="">選択してください</option>
                    {(formRoster[form.playerA] || []).map((name, i) => <option key={name + i} value={name}>{`${i + 1}. ${name}`}</option>)}
                  </select>
                </div>
                <div>
                  <label className="pw-label">{form.playerB} 先発</label>
                  <select className="pw-select" value={form.starterB} onChange={(e) => updateForm("starterB", e.target.value)}>
                    <option value="">選択してください</option>
                    {(formRoster[form.playerB] || []).map((name, i) => <option key={name + i} value={name}>{`${i + 1}. ${name}`}</option>)}
                  </select>
                </div>
              </div>

              <label className="pw-cold-row">
                <input type="checkbox" checked={form.cold} onChange={(e) => updateForm("cold", e.target.checked)} />
                コールド勝ち（勝敗を2としてカウント）
              </label>

              {error && <div className="pw-error">{error}</div>}

              <button className="pw-submit" type="submit">この試合を保存</button>
            </form>
          )}

          <div className="pw-loglabel">試合ログ</div>

          {loading ? (
            <div className="pw-empty">読み込み中…</div>
          ) : sortedGames.length === 0 ? (
            <div className="pw-empty">まだ記録がありません。<br />上のボタンから最初の試合を記録しましょう。</div>
          ) : (
            sortedGames.map((g) => {
              const r = resultOf(g);
              return (
                <div className={`pw-card${g.cold ? " cold" : ""}`} key={g.id}>
                  <div className="pw-card-top">
                    <span className="pw-date">{g.date || `第${g.no}試合`}</span>
                    <div className="pw-badges">
                      {g.cold && <span className="pw-badge">🔥 コールド</span>}
                      {g.note && <span className="pw-badge note">{g.note}</span>}
                      {isLatest && <button className="pw-del" onClick={() => deleteGame(g.id)}>🗑</button>}
                    </div>
                  </div>
                  <div className="pw-matchup">
                    <div className={`pw-side ${r === "A" ? "win" : r === "B" ? "lose" : ""}`}>
                      <div className="pname">{g.playerA}</div>
                      <div className="pscore">{g.scoreA}</div>
                      <div className="starter">{g.starterA}</div>
                    </div>
                    <div className="pw-dash">–</div>
                    <div className={`pw-side ${r === "B" ? "win" : r === "A" ? "lose" : ""}`}>
                      <div className="pname">{g.playerB}</div>
                      <div className="pscore">{g.scoreB}</div>
                      <div className="starter">{g.starterB}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </>
      )}

      {tab === "draft" && <DraftTab />}

      {tab === "draw" && <DrawTab roster={currentRoster} league={currentLeague} leagueGames={games.filter((g) => (g.league || 1) === currentLeague)} />}

      {tab === "stats" && (
        <>
          <div className="pw-scoperow">
            <label className="pw-label">集計の範囲</label>
            <select className="pw-select" value={statsScope} onChange={(e) => setStatsScope(e.target.value)}>
              <option value="all">通算（全リーグ）</option>
              {Array.from({ length: currentLeague }, (_, i) => i + 1).map((l) => (
                <option key={l} value={l}>第{l}期{l === currentLeague ? "（進行中）" : ""}</option>
              ))}
            </select>
          </div>

          {/* 優勝数（通算のときだけ表示。各期を選んだときは出さない） */}
          {statsScope === "all" && (
            <>
              <div className="pw-sectiontitle">🏆 優勝数</div>
              <div className="pw-board">
                {PLAYERS.map((p) => (
                  <div className="pw-cell" key={p}>
                    <div className="name">{p}</div>
                    <div className="record">{titleCount[p]}</div>
                    <div className="rate">回</div>
                    <div className="pw-ranks">
                      {[0, 1, 2].map((i) => (
                        <span key={i}><small>{i + 1}位</small><b>{rankCounts[p][i]}</b></span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              {Object.keys(champions).length === 0 ? (
                <div className="pw-note">優勝はまだありません（首位と最下位の勝ち数が5勝差になると優勝が決まります）。</div>
              ) : (
                <div className="pw-champlist">
                  {Object.entries(champions).map(([l, list]) => (
                    <div key={l} className="pw-champrow">
                      <span>第{l}期{Number(l) === currentLeague ? "（進行中）" : ""}</span>
                      {list.length > 0
                        ? <span className="pw-champname">🏆 {list.join("・")}</span>
                        : <span>優勝なし</span>}
                    </div>
                  ))}
                </div>
              )}
            </>
          )}

          {/* 勝敗・得失点 */}
          <div className="pw-sectiontitle">勝敗・得失点</div>
          <div className="pw-table">
            <div className="pw-tr head t-record">
              <span>名前</span><span>勝-敗</span><span>勝率</span><span>得点</span><span>失点</span><span>差</span>
            </div>
            {PLAYERS.map((p) => {
              const s = statsTally[p];
              const diff = s.pf - s.pa;
              return (
                <div className="pw-tr t-record" key={p}>
                  <span className="strong">{p}</span>
                  <span>{s.win}-{s.lose}{s.draw ? <em>({s.draw}分)</em> : null}</span>
                  <span>{pct(s.win, s.lose)}</span>
                  <span>{s.pf}</span>
                  <span>{s.pa}</span>
                  <span className={diff > 0 ? "plus" : diff < 0 ? "minus" : ""}>{signed(diff)}</span>
                </div>
              );
            })}
          </div>
          <div className="pw-note">コールド勝ちは2勝(2敗)として数えています。</div>

          {/* 対戦表 */}
          <div className="pw-sectiontitle">対戦表</div>
          <div className="pw-h2h">
            <div className="pw-h2h-row head">
              <span></span>
              {PLAYERS.map((q) => <span key={q}>vs {q}</span>)}
            </div>
            {PLAYERS.map((p) => (
              <div className="pw-h2h-row" key={p}>
                <span className="pw-h2h-name">{p}</span>
                {PLAYERS.map((q) => {
                  if (p === q) return <span key={q} className="pw-h2h-self">—</span>;
                  const c = statsH2H[p][q];
                  const state = c.win > c.lose ? "up" : c.win < c.lose ? "down" : "";
                  return (
                    <span key={q} className={`pw-h2h-cell ${state}`}>
                      <b>{c.win}-{c.lose}</b>
                      <small>{c.pf}-{c.pa}</small>
                    </span>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="pw-note">大きい数字が勝敗、小さい数字が得点-失点（行の人から見た成績）。</div>

          {/* 先発別 */}
          <div className="pw-sectiontitle">先発 最多勝</div>
          {statsPitchers.length === 0 ? (
            <div className="pw-empty">先発を選んで記録した試合がまだありません。</div>
          ) : (
            <>
              <div className="pw-table">
                <div className="pw-tr head t-pitch">
                  <span>#</span><span>投手</span><span>登板</span><span>勝</span><span>敗</span>
                </div>
                {shownPitchers.map((pt, i) => (
                  <div className="pw-tr t-pitch" key={pt.owner + pt.name}>
                    <span>{pt.win === topPitcherWin && pt.win > 0 ? "🥇" : i + 1}</span>
                    <span className="strong">{pt.name}<em>{pt.owner}</em></span>
                    <span>{pt.starts}</span>
                    <span className="plus">{pt.win}</span>
                    <span>{pt.lose}</span>
                  </div>
                ))}
              </div>
              {statsPitchers.length > 10 && (
                <button className="pw-backlatest" onClick={() => setShowAllPitchers((v) => !v)}>
                  {showAllPitchers ? "上位10人だけ表示" : `すべて表示（${statsPitchers.length}人）`}
                </button>
              )}
              <div className="pw-note">先発投手のチームが勝った試合を勝ちとして数えています（コールドでも1勝）。</div>
            </>
          )}
        </>
      )}
    </div>
  );
}
