  const app = initializeApp(FIREBASE_CONFIG);
  const db = getFirestore(app);
  const gamesRef = doc(db, "pawapuro", "games");

  // 既存データ（league / rosters が無い古い形式）も壊さずに読み込む
  function normalize(data) {
    const games = ((data && data.list) || []).map((g) => ({ league: 1, ...g }));
    const currentLeague = (data && data.currentLeague) || 1;
    const rosters = (data && data.rosters) || {};
    const importedPast = !!(data && data.importedPast);
    return { games, currentLeague, rosters, importedPast };
  }

  const EMPTY = { games: [], currentLeague: 1, rosters: {}, importedPast: false };

  window.fb = {
    async load() {
      const snap = await getDoc(gamesRef);
      return snap.exists() ? normalize(snap.data()) : EMPTY;
    },
    async save({ games, currentLeague, rosters, importedPast }) {
      await setDoc(gamesRef, { list: games, currentLeague, rosters, importedPast: !!importedPast });
    },
    // 取り込み前の状態を別ドキュメントに控えておく（万一のとき元に戻せる）
    async saveBackup({ games, currentLeague, rosters }) {
      await setDoc(doc(db, "pawapuro", "backup_before_import"), {
        list: games, currentLeague, rosters, savedAt: new Date().toISOString(),
      });
    },
    subscribe(callback) {
      return onSnapshot(gamesRef, (snap) => {
        callback(snap.exists() ? normalize(snap.data()) : EMPTY);
      });
    },
  };
  window.dispatchEvent(new Event("fb-ready"));
</script>

function buildImport(latest) {
  const off = PAST_LEAGUE_COUNT;
  const games = latest.games.map((g) => ({ ...g, league: (g.league || 1) + off }));
  const rosters = {};
  Object.entries(latest.rosters || {}).forEach(([k, v]) => { rosters[Number(k) + off] = v; });
  return {
    games: [...PAST_GAMES, ...games],
    currentLeague: latest.currentLeague + off,
    rosters,
    importedPast: true,
  };
}

function getRosterFor(rosters, league) {

    if (rosters[l]) return rosters[l];

  return DEFAULT_ROSTER;

function resultOf(g) {
  const a = Number(g.scoreA);
  const b = Number(g.scoreB);
  if (a === b) return "draw";
  return a > b ? "A" : "B";
}

// ---- 集計 -------------------------------------------------------------
// 勝敗はコールドを2勝(2敗)として数える（リーグ戦の規則と同じ）

function computeTally(list) {
  const t = Object.fromEntries(
    PLAYERS.map((p) => [p, { win: 0, lose: 0, draw: 0, pf: 0, pa: 0, games: 0 }])
  );
  list.forEach((g) => {
    const a = t[g.playerA];
    const b = t[g.playerB];
    if (!a || !b) return;
    const w = g.cold ? 2 : 1;
    const r = resultOf(g);
    a.pf += Number(g.scoreA); a.pa += Number(g.scoreB);
    b.pf += Number(g.scoreB); b.pa += Number(g.scoreA);
    a.games += 1; b.games += 1;
    if (r === "draw") { a.draw += 1; b.draw += 1; }
    else if (r === "A") { a.win += w; b.lose += w; }
    else { b.win += w; a.lose += w; }
  });
  return t;
}

// 対戦表: h[自分][相手] = その相手との成績
function computeH2H(list) {
  const h = {};
  PLAYERS.forEach((p) => {
    h[p] = {};
    PLAYERS.forEach((q) => { h[p][q] = { win: 0, lose: 0, draw: 0, pf: 0, pa: 0 }; });
  });
  list.forEach((g) => {
    const A = g.playerA, B = g.playerB;
    if (!h[A] || !h[B]) return;
    const w = g.cold ? 2 : 1;
    const r = resultOf(g);
    h[A][B].pf += Number(g.scoreA); h[A][B].pa += Number(g.scoreB);
    h[B][A].pf += Number(g.scoreB); h[B][A].pa += Number(g.scoreA);
    if (r === "draw") { h[A][B].draw += 1; h[B][A].draw += 1; }
    else if (r === "A") { h[A][B].win += w; h[B][A].lose += w; }
    else { h[B][A].win += w; h[A][B].lose += w; }
  });
  return h;
}

// 先発投手ごとの成績（勝ち負けは1試合につき1。コールドでも1として数える）
function computePitchers(list) {
  const map = {};
  function add(owner, name, won, lost) {
    if (!name) return;
    const key = owner + "|" + name;
    if (!map[key]) map[key] = { owner, name, starts: 0, win: 0, lose: 0 };
    map[key].starts += 1;
    if (won) map[key].win += 1;
    if (lost) map[key].lose += 1;
  }
  list.forEach((g) => {
    const r = resultOf(g);
    add(g.playerA, g.starterA, r === "A", r === "B");
    add(g.playerB, g.starterB, r === "B", r === "A");
  });
  return Object.values(map).sort(
    (x, y) => y.win - x.win || x.lose - y.lose || y.starts - x.starts
  );
}

// 優勝の定義: 首位の勝ち数が最下位の勝ち数より5以上多くなったら、首位（勝ち数が最多）の人が優勝。
// 順位は勝ち数で決まる。5勝差に届かないままリーグを終了した場合は「優勝なし」（空配列）。
// 進行中のリーグは、5勝差に達した時点で優勝が決まる。
const TITLE_GAP = 5;
function computeChampions(games, currentLeague) {
  const result = {};
  for (let l = 1; l <= currentLeague; l++) {
    const lg = games.filter((g) => (g.league || 1) === l);
    if (lg.length === 0) continue;
    const t = computeTally(lg);
    const wins = PLAYERS.map((p) => t[p].win);
    const top = Math.max(...wins);
    const bottom = Math.min(...wins);
    if (top - bottom >= TITLE_GAP) {
      result[l] = PLAYERS.filter((p) => t[p].win === top);
    } else if (l < currentLeague) {
      result[l] = [];
    }
  }
  return result;
}

// 勝率は野球式（.590 / 1.000）。試合が無いときは .000
const pct = (w, l) => {
  if (w + l === 0) return ".000";
  const r = (w / (w + l)).toFixed(3);
  return r.startsWith("0") ? r.slice(1) : r;
};
const signed = (n) => (n > 0 ? `+${n}` : `${n}`);

  const topWin = Math.max(...wins);
  const bottomWin = Math.min(...wins);
  const gap = topWin - bottomWin;
  const gapLevel = gap >= 5 ? "critical" : gap >= 3 ? "warn" : "normal";

    () => [...leagueGames].sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : (y.id || 0) - (x.id || 0))),
    [leagueGames]

  // ---- 通算画面の集計 ----
  const champions = useMemo(() => computeChampions(games, currentLeague), [games, currentLeague]);
  const statsGames = useMemo(
    () => (statsScope === "all" ? games : games.filter((g) => (g.league || 1) === Number(statsScope))),

  const statsTally = useMemo(() => computeTally(statsGames), [statsGames]);

  const rankCounts = useMemo(() => {
    const c = Object.fromEntries(PLAYERS.map((p) => [p, [0, 0, 0]]));
    Object.keys(champions).forEach((l) => {
      if (statsScope !== "all" && Number(l) !== Number(statsScope)) return;
      const t = computeTally(games.filter((g) => (g.league || 1) === Number(l)));
      PLAYERS.forEach((p) => {
        const rank = 1 + PLAYERS.filter((q) => t[q].win > t[p].win).length;
        c[p][rank - 1] += 1;

    return c;
  }, [games, champions, statsScope]);
  const titleCount = useMemo(() => {
    const c = Object.fromEntries(PLAYERS.map((p) => [p, 0]));
    Object.values(champions).forEach((list) => list.forEach((p) => { c[p] += 1; }));

  const currentRoster = getRosterFor(rosters, currentLeague);

  // 常に最新のデータを読み直してから書き込む（3人が別々に使っても上書きしない）
  async function persistAll(mutate) {
    try {
      const latest = await window.fb.load();
      const next = mutate(latest);
      await window.fb.save(next);
      applyData(next);
      setSaveError("");
      return next;
    } catch {
      setSaveError("保存に失敗しました。通信環境を確認してもう一度お試しください。");
      return null;
    }
  }

  async function submitForm(e) {
    e.preventDefault();
    if (form.playerA === form.playerB) { setError("対戦相手が同じ人になっています。"); return; }
    if (form.scoreA === "" || form.scoreB === "") { setError("点数を入力してください。"); return; }
    setError("");
    const newGame = {
      id: Date.now(),
      date: form.date,
      playerA: form.playerA,
      playerB: form.playerB,
      scoreA: Number(form.scoreA),
      scoreB: Number(form.scoreB),
      starterA: form.starterA,
      starterB: form.starterB,
      cold: form.cold,
      league: currentLeague,
    };
    await persistAll((latest) => ({ ...latest, games: [...latest.games, newGame] }));
    setForm(emptyForm());
    setShowForm(false);
  }

  async function deleteGame(id) {
    await persistAll((latest) => ({ ...latest, games: latest.games.filter((g) => g.id !== id) }));
  }

  // ---- リーグ移行 ----
  function openRosterEditor(league, rostersObj) {
    const r = getRosterFor(rostersObj, league);
    const draft = {};
    PLAYERS.forEach((p) => {
      draft[p] = Array.from({ length: ROSTER_SIZE }, (_, i) => (r[p] && r[p][i]) || "");
    });
    setRosterDraft(draft);
  }

  async function startNewLeague() {
    const ok = window.confirm(
      `第${currentLeague}期を終了して、第${currentLeague + 1}期を始めますか？\nこれまでの記録は消えず、「通算成績」にも反映されます。`
    );
    if (!ok) return;
    const next = await persistAll((latest) => {
      const n = latest.currentLeague + 1;
      const prevRoster = getRosterFor(latest.rosters, latest.currentLeague);
      return {
        ...latest,
        currentLeague: n,
        rosters: { ...latest.rosters, [n]: prevRoster },
      };
    });
    if (!next) return;
    setFollowLatest(true);
    setViewingLeague(next.currentLeague);
    setTab("league");
    // 新しいチームの先発メンバーをすぐ登録できるように編集画面を開く
    openRosterEditor(next.currentLeague, next.rosters);
  }

  async function importPastLeagues() {
    const ok = window.confirm(
      "過去の第1〜3期（43試合）を取り込みます。\n今入っている記録は第4期以降として残ります。\n取り込みは1回だけです。よろしいですか？"
    );
    if (!ok) return;
    setImportBusy(true);
    try {
      const latest = await window.fb.load();
      const already = latest.importedPast || latest.games.some((g) => g.id >= 100000 && g.id < 200000);
      if (already) {
        window.alert("すでに取り込み済みです。");
        applyData({ ...latest, importedPast: true });
        return;
      }
      await window.fb.saveBackup(latest);
      const next = buildImport(latest);
      await window.fb.save(next);
      applyData(next);
      setFollowLatest(true);
      setViewingLeague(next.currentLeague);
      setSaveError("");
      window.alert("取り込みました。「通算成績」タブで確認してください。");
    } catch {
      setSaveError("取り込みに失敗しました。通信環境を確認してもう一度お試しください。（データは変更されていません）");
    } finally {
      setImportBusy(false);
    }
  }

  function updateDraft(player, idx, val) {
    setRosterDraft((d) => ({ ...d, [player]: d[player].map((v, i) => (i === idx ? val : v)) }));
  }

  async function saveRoster() {
    const cleaned = {};
    PLAYERS.forEach((p) => {
      cleaned[p] = rosterDraft[p].map((s) => s.trim()).filter((s) => s !== "");
    });
    const next = await persistAll((latest) => ({
      ...latest,
      rosters: { ...latest.rosters, [latest.currentLeague]: cleaned },
    }));
    if (next) {
      setRosterDraft(null);
      setForm(emptyForm());
    }
  }

  const isLatest = viewingLeague === currentLeague;
  const shownPitchers = showAllPitchers ? statsPitchers : statsPitchers.slice(0, 10);
  const topPitcherWin = statsPitchers.length ? statsPitchers[0].win : 0;

  return (
    <div className="pw-root">
      <div className="pw-header">
        <div className="pw-title">
          パワスタ
          <small>左座 / 長谷川 / 正覚 — 成績帳</small>
        </div>
      </div>

      {saveError && <div className="pw-savewarn">{saveError}</div>}

      {showImport && !importedPast && !loading && (
        <div className="pw-importbox">
          <div className="pw-importtitle">過去の大会を取り込む</div>
          <div className="pw-importtext">
            第1期・第2期・第3期（計43試合）を追加します。いま入っている記録は、第{PAST_LEAGUE_COUNT + 1}期以降として残ります。取り込みは1回だけです。
          </div>
          <button className="pw-submit" onClick={importPastLeagues} disabled={importBusy}>
            {importBusy ? "取り込み中…" : "過去の3大会を取り込む"}
          </button>
        </div>
      )}

      <div className="pw-tabs">
        <button className={`pw-tab${tab === "league" ? " on" : ""}`} onClick={() => setTab("league")}>リーグ</button>
        <button className={`pw-tab${tab === "stats" ? " on" : ""}`} onClick={() => setTab("stats")}>通算成績</button>
      </div>

      {tab === "league" && (
        <>
          <div className="pw-leaguebar">
            <button className="pw-leaguenav" onClick={prevLeague} disabled={viewingLeague <= 1}>‹</button>
            <div className="pw-leaguelabel">
              第{viewingLeague}期
              {!isLatest && <span className="pw-leaguepast">過去のリーグ</span>}
            </div>
            <button className="pw-leaguenav" onClick={nextLeague} disabled={viewingLeague >= currentLeague}>›</button>
          </div>
          {!isLatest && (
            <button className="pw-backlatest" onClick={backToLatest}>最新の第{currentLeague}期に戻る</button>
          )}

          <div className="pw-board">
            {PLAYERS.map((p) => {
              const s = standings[p];
              const rate = pct(s.win, s.lose);
              const isLeader = s.win === topWin && topWin > bottomWin;
              return (
                <div className={`pw-cell${isLeader ? " leader" : ""}`} key={p}>
                  <div className="name">{isLeader && "🏆 "}{p}</div>
                  <div className="record">{s.win}<span className="sep">-</span>{s.lose}</div>
                  <div className="rate">勝率 {rate}{s.draw ? ` / 分${s.draw}` : ""}</div>
                </div>
              );
            })}
          </div>

          <div className={`pw-gap ${gapLevel}`}>
            <span>首位差</span>
            <span className="pw-gap-num">{gap}</span>
            <span>勝</span>
            {gap >= 5 && <span className="pw-gap-tag">🏁 決着ライン到達</span>}
          </div>

          {isLatest && (
            <div className="pw-actions">
              <button className="pw-newleague" onClick={startNewLeague}>
                {gap >= 5 ? "🏆 このリーグを終了して次のリーグへ" : "リーグを終了して次のリーグへ"}
              </button>
              <button className="pw-rosterbtn" onClick={() => openRosterEditor(currentLeague, rosters)}>
                第{currentLeague}期の先発メンバーを編集
              </button>
            </div>
          )}

          {isLatest && rosterDraft && (
            <div className="pw-form">
              <div className="pw-form-head">
                <span>第{currentLeague}期 先発メンバー</span>
                <button type="button" onClick={() => setRosterDraft(null)}>✕</button>
              </div>
              <div className="pw-rosterhint">チームが変わったら、それぞれの先発6人を入力してください（空欄は無視されます）。過去の記録は変わりません。</div>
              <div className="pw-rostergrid">
                {PLAYERS.map((p) => (
                  <div key={p}>
                    <div className="pw-rostername">{p}</div>
                    {rosterDraft[p].map((val, i) => (
                      <input
                        key={i}
                        className="pw-input pw-rosterinput"
                        type="text"
                        placeholder={`${i + 1}`}
                        value={val}
                        onChange={(e) => updateDraft(p, i, e.target.value)}
                      />
                    ))}
                  </div>
                ))}
              </div>
              <button className="pw-submit" type="button" onClick={saveRoster}>この内容で保存</button>
            </div>
          )}

          {isLatest ? (
            !showForm && (
              <button className="pw-addbtn" onClick={() => setShowForm(true)}>＋ 試合を記録する</button>
            )
          ) : (
            <div className="pw-empty">過去のリーグは閲覧のみです。記録するには最新のリーグに戻ってください。</div>
          )}

          {showForm && isLatest && (
            <form className="pw-form" onSubmit={submitForm}>
              <div className="pw-form-head">
                <span>試合を記録</span>
                <button type="button" onClick={() => { setShowForm(false); setError(""); }}>✕</button>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">日付</label>
                  <input className="pw-input" type="date" value={form.date} onChange={(e) => updateForm("date", e.target.value)} />
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">プレイヤーA</label>
                  <select className="pw-select" value={form.playerA} onChange={(e) => changePlayerA(e.target.value)}>
                    {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="pw-vs">vs</div>
                <div>
                  <label className="pw-label">プレイヤーB</label>
                  <select className="pw-select" value={form.playerB} onChange={(e) => changePlayerB(e.target.value)}>
                    {PLAYERS.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">{form.playerA} 得点</label>
                  <input className="pw-input" type="number" inputMode="numeric" value={form.scoreA} onChange={(e) => updateForm("scoreA", e.target.value)} />
                </div>
                <div>
                  <label className="pw-label">{form.playerB} 得点</label>
                  <input className="pw-input" type="number" inputMode="numeric" value={form.scoreB} onChange={(e) => updateForm("scoreB", e.target.value)} />
                </div>
              </div>

              <div className="pw-row">
                <div>
                  <label className="pw-label">{form.playerA} 先発</label>
                  <select className="pw-select" value={form.starterA} onChange={(e) => updateForm("starterA", e.target.value)}>
                    <option value="">選択してください</option>
                    {(formRoster[form.playerA] || []).map((name, i) => <option key={name + i} value={name}>{`${i + 1}. ${name}`}</option>)}
                  </select>
                </div>
                <div>
                  <label className="pw-label">{form.playerB} 先発</label>
                  <select className="pw-select" value={form.starterB} onChange={(e) => updateForm("starterB", e.target.value)}>
                    <option value="">選択してください</option>
                    {(formRoster[form.playerB] || []).map((name, i) => <option key={name + i} value={name}>{`${i + 1}. ${name}`}</option>)}
                  </select>
                </div>
              </div>

              <label className="pw-cold-row">
                <input type="checkbox" checked={form.cold} onChange={(e) => updateForm("cold", e.target.checked)} />
                コールド勝ち（勝敗を2としてカウント）
              </label>

              {error && <div className="pw-error">{error}</div>}

              <button className="pw-submit" type="submit">この試合を保存</button>
            </form>
          )}

          <div className="pw-loglabel">試合ログ</div>

          {loading ? (
            <div className="pw-empty">読み込み中…</div>
          ) : sortedGames.length === 0 ? (
            <div className="pw-empty">まだ記録がありません。<br />上のボタンから最初の試合を記録しましょう。</div>
          ) : (
            sortedGames.map((g) => {
              const r = resultOf(g);
              return (
                <div className={`pw-card${g.cold ? " cold" : ""}`} key={g.id}>
                  <div className="pw-card-top">
                    <span className="pw-date">{g.date || `第${g.no}試合`}</span>
                    <div className="pw-badges">
                      {g.cold && <span className="pw-badge">🔥 コールド</span>}
                      {g.note && <span className="pw-badge note">{g.note}</span>}
                      {isLatest && <button className="pw-del" onClick={() => deleteGame(g.id)}>🗑</button>}
                    </div>
                  </div>
                  <div className="pw-matchup">
                    <div className={`pw-side ${r === "A" ? "win" : r === "B" ? "lose" : ""}`}>
                      <div className="pname">{g.playerA}</div>
                      <div className="pscore">{g.scoreA}</div>
                      <div className="starter">{g.starterA}</div>
                    </div>
                    <div className="pw-dash">–</div>
                    <div className={`pw-side ${r === "B" ? "win" : r === "A" ? "lose" : ""}`}>
                      <div className="pname">{g.playerB}</div>
                      <div className="pscore">{g.scoreB}</div>
                      <div className="starter">{g.starterB}</div>
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </>
      )}

      {tab === "stats" && (
        <>
          <div className="pw-scoperow">
            <label className="pw-label">集計の範囲</label>
            <select className="pw-select" value={statsScope} onChange={(e) => setStatsScope(e.target.value)}>
              <option value="all">通算（全リーグ）</option>
              {Array.from({ length: currentLeague }, (_, i) => i + 1).map((l) => (
                <option key={l} value={l}>第{l}期{l === currentLeague ? "（進行中）" : ""}</option>
              ))}
            </select>
          </div>

          {/* 優勝数 */}
          <div className="pw-sectiontitle">🏆 優勝数</div>
          <div className="pw-board">
            {PLAYERS.map((p) => {
              const champOfScope = statsScope === "all"
                ? titleCount[p]
                : (champions[statsScope] || []).includes(p) ? 1 : 0;
              return (
                <div className="pw-cell" key={p}>
                  <div className="name">{p}</div>
                  <div className="record">{champOfScope}</div>
                  <div className="rate">回</div>
                  <div className="pw-ranks">
                    {[0, 1, 2].map((i) => (
                      <span key={i}><small>{i + 1}位</small><b>{rankCounts[p][i]}</b></span>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
          {statsScope === "all" ? (
            Object.keys(champions).length === 0 ? (
              <div className="pw-note">優勝はまだありません（首位と最下位の勝ち数が5勝差になると優勝が決まります）。</div>
            ) : (
              <div className="pw-champlist">
                {Object.entries(champions).map(([l, list]) => (
                  <div key={l} className="pw-champrow">
                    <span>第{l}期{Number(l) === currentLeague ? "（進行中）" : ""}</span>
                    {list.length > 0
                      ? <span className="pw-champname">🏆 {list.join("・")}</span>
                      : <span>優勝なし</span>}
                  </div>
                ))}
              </div>
            )
          ) : champions[statsScope] === undefined ? (
            <div className="pw-note">第{statsScope}期はまだ優勝が決まっていません（5勝差で決定）。</div>
          ) : champions[statsScope].length === 0 ? (
            <div className="pw-note">第{statsScope}期は5勝差に届かないまま終了したため、優勝なしです。</div>
          ) : null}

          {/* 勝敗・得失点 */}
          <div className="pw-sectiontitle">勝敗・得失点</div>
          <div className="pw-table">
            <div className="pw-tr head t-record">
              <span>名前</span><span>勝-敗</span><span>勝率</span><span>得点</span><span>失点</span><span>差</span>
            </div>
            {PLAYERS.map((p) => {
              const s = statsTally[p];
              const diff = s.pf - s.pa;
              return (
                <div className="pw-tr t-record" key={p}>
                  <span className="strong">{p}</span>
                  <span>{s.win}-{s.lose}{s.draw ? <em>({s.draw}分)</em> : null}</span>
                  <span>{pct(s.win, s.lose)}</span>
                  <span>{s.pf}</span>
                  <span>{s.pa}</span>
                  <span className={diff > 0 ? "plus" : diff < 0 ? "minus" : ""}>{signed(diff)}</span>
                </div>
              );
            })}
          </div>
          <div className="pw-note">コールド勝ちは2勝(2敗)として数えています。</div>

          {/* 対戦表 */}
          <div className="pw-sectiontitle">対戦表</div>
          <div className="pw-h2h">
            <div className="pw-h2h-row head">
              <span></span>
              {PLAYERS.map((q) => <span key={q}>vs {q}</span>)}
            </div>
            {PLAYERS.map((p) => (
              <div className="pw-h2h-row" key={p}>
                <span className="pw-h2h-name">{p}</span>
                {PLAYERS.map((q) => {
                  if (p === q) return <span key={q} className="pw-h2h-self">—</span>;
                  const c = statsH2H[p][q];
                  const state = c.win > c.lose ? "up" : c.win < c.lose ? "down" : "";
                  return (
                    <span key={q} className={`pw-h2h-cell ${state}`}>
                      <b>{c.win}-{c.lose}</b>
                      <small>{c.pf}-{c.pa}</small>
                    </span>
                  );
                })}
              </div>
            ))}
          </div>
          <div className="pw-note">大きい数字が勝敗、小さい数字が得点-失点（行の人から見た成績）。</div>

          {/* 先発別 */}
          <div className="pw-sectiontitle">先発 最多勝</div>
          {statsPitchers.length === 0 ? (
            <div className="pw-empty">先発を選んで記録した試合がまだありません。</div>
          ) : (
            <>
              <div className="pw-table">
                <div className="pw-tr head t-pitch">
                  <span>#</span><span>投手</span><span>登板</span><span>勝</span><span>敗</span>
                </div>
                {shownPitchers.map((pt, i) => (
                  <div className="pw-tr t-pitch" key={pt.owner + pt.name}>
                    <span>{pt.win === topPitcherWin && pt.win > 0 ? "🥇" : i + 1}</span>
                    <span className="strong">{pt.name}<em>{pt.owner}</em></span>
                    <span>{pt.starts}</span>
                    <span className="plus">{pt.win}</span>
                    <span>{pt.lose}</span>
                  </div>
                ))}
              </div>
              {statsPitchers.length > 10 && (
                <button className="pw-backlatest" onClick={() => setShowAllPitchers((v) => !v)}>
                  {showAllPitchers ? "上位10人だけ表示" : `すべて表示（${statsPitchers.length}人）`}
                </button>
              )}
              <div className="pw-note">先発投手のチームが勝った試合を勝ちとして数えています（コールドでも1勝）。</div>
            </>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PawapuroScorebook />);
</script>

<style>
  .pw-root {
    --field: #142c22; --field-deep: #0d1d16; --chalk: #f3efe1; --chalk-dim: #b9c4b8;
    --amber: #f0a83b; --amber-dim: #a97b32; --foul: #d1544a; --panel: #0f1b16; --line: rgba(243,239,225,0.14);
    font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    background: var(--field);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 46px);
    color: var(--chalk); min-height: 100vh; padding: 18px 14px 40px; box-sizing: border-box;
    max-width: 640px; margin: 0 auto;
  }
  .pw-root * { box-sizing: border-box; }
  .pw-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--line); }
  .pw-title { font-weight: 700; font-size: 30px; letter-spacing: 0.04em; color: var(--chalk); line-height: 1; }
  .pw-title small { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.18em; color: var(--chalk-dim); margin-top: 4px; }

  .pw-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .pw-tab { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--chalk-dim); border-radius: 4px; padding: 9px; font-size: 13px; font-weight: 700; letter-spacing: 0.05em; cursor: pointer; font-family: inherit; }
  .pw-tab.on { background: var(--amber); color: #1a1206; border-color: var(--amber); }

  .pw-leaguebar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 4px; }
  .pw-leaguenav { background: var(--panel); border: 1px solid var(--line); color: var(--chalk); width: 30px; height: 30px; border-radius: 4px; font-size: 16px; cursor: pointer; }
  .pw-leaguenav:disabled { opacity: 0.3; cursor: default; }
  .pw-leaguelabel { font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: var(--chalk); display: flex; align-items: center; gap: 6px; }
  .pw-leaguepast { font-size: 10px; font-weight: 700; color: var(--amber); background: rgba(240,168,59,0.14); padding: 2px 6px; border-radius: 3px; letter-spacing: 0.04em; }
  .pw-backlatest { display: block; margin: 6px auto 12px; background: none; border: 1px solid var(--line); color: var(--chalk-dim); font-size: 11px; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-family: inherit; }

  .pw-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; margin-bottom: 10px; }
  .pw-cell { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 6px 8px; text-align: center; }
  .pw-cell.leader { border-color: var(--amber-dim); box-shadow: 0 0 0 1px var(--amber-dim) inset; }
  .pw-cell .name { font-size: 12px; font-weight: 700; color: var(--chalk-dim); letter-spacing: 0.05em; margin-bottom: 6px; }
  .pw-cell .record { font-size: 28px; font-weight: 700; letter-spacing: 0.02em; color: var(--amber); text-shadow: 0 0 10px rgba(240,168,59,0.35); line-height: 1; }
